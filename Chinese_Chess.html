<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #2b5a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 16px;
        }
        .game-container {
            display: flex;
            flex-wrap: nowrap;
            background: #e8d5b5;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            max-width: 1400px;
            width: fit-content;
            gap: 24px;
        }
        .record-panel {
            width: 220px;
            background: #f0e2c5;
            border-radius: 20px;
            padding: 16px 10px;
            box-shadow: inset 0 0 0 2px #baa07a, 0 8px 12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        
        .debug-panel {
            width: 220px;
            background: #f0e2c5;
            border-radius: 20px;
            padding: 16px 10px;
            box-shadow: inset 0 0 0 2px #baa07a, 0 8px 12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        
        .debug-panel h3 {
            text-align: center;
            margin: 0 0 12px 0;
            color: #3d2a1a;
            font-weight: 600;
            font-size: 1.4rem;
            border-bottom: 2px solid #b59e7c;
            padding-bottom: 6px;
        }
        
        .debug-log {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 1rem;
            color: #2c1e12;
            white-space: pre-wrap;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
        }
        .record-panel h3 {
            text-align: center;
            margin: 0 0 12px 0;
            color: #3d2a1a;
            font-weight: 600;
            font-size: 1.4rem;
            border-bottom: 2px solid #b59e7c;
            padding-bottom: 6px;
        }
        .move-list {
            flex: 1;
            overflow-y: auto;
            padding-left: 20px;
            font-size: 1.1rem;
            color: #2c1e12;
            list-style-type: cjk-ideographic;
        }
        .move-list li {
            margin-bottom: 6px;
            font-family: 'KaiTi', '楷体', monospace;
            border-bottom: 1px dotted #c2aa88;
            padding: 2px 0;
        }
        .move-list li.red-move {
            color: #b02b2b;
        }
        .move-list li.black-move {
            color: #1e3a3a;
        }
        .board-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        canvas {
            display: block;
            border-radius: 18px;
            box-shadow: 0 0 0 4px #6f4f2e, 0 12px 24px black;
            background: #e3c184;
            cursor: pointer;
        }
        .control-panel {
            width: 220px;
            background: #f0e2c5;
            border-radius: 20px;
            padding: 16px 10px;
            box-shadow: inset 0 0 0 2px #baa07a, 0 8px 12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        .control-panel h3 {
            margin: 0 0 16px 0;
            font-size: 1.3rem;
            color: #3b2c18;
            text-align: center;
            font-weight: bold;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .difficulty-select {
            background: #fcf3e0;
            border: 2px solid #7b5f3a;
            border-radius: 32px;
            padding: 6px 14px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2d1f0f;
            cursor: pointer;
            outline: none;
        }
        button {
            background: #f5e7cc;
            border: none;
            border-radius: 40px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: bold;
            color: #3b2c18;
            border: 2px solid #8b6f48;
            box-shadow: 0 4px 0 #5d4a2e;
            cursor: pointer;
            transition: 0.1s linear;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        button:disabled {
            opacity: 0.5;
            pointer-events: none;
            transform: none;
        }
        .status {
            font-size: 1.1rem;
            font-weight: bold;
            background: #3e5d4c;
            color: #efdfb7;
            padding: 10px 16px;
            border-radius: 40px;
            box-shadow: inset 0 -2px 0 #1d3327;
            text-align: center;
            margin-bottom: 16px;
        }
        .status.thinking {
            background: #b02b2b;
            animation: pulse 1s infinite;
        }
        .ai-difficulty {
            font-size: 1rem;
            font-weight: bold;
            background: #8b4513;
            color: #f5e7cc;
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: inset 0 -2px 0 #5d2e0a;
            text-align: center;
            margin-bottom: 16px;
        }
        .game-difficulty-display {
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: #f5e7cc;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: inset 0 -2px 0 #5d2e0a;
            text-align: center;
            margin-bottom: 12px;
            border: 2px solid #baa07a;
        }
        .difficulty-select {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #f0e2c5;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 1000;
            min-width: 200px;
        }
        .ai-settings h4 {
            margin: 0 0 12px 0;
            color: #3d2a1a;
            font-size: 1.1rem;
            border-bottom: 2px solid #b59e7c;
            padding-bottom: 8px;
        }
        .ai-settings label {
            display: block;
            margin-bottom: 8px;
            color: #2c1e12;
            font-size: 0.95rem;
        }
        .ai-settings select {
            width: 100%;
            background: #fcf3e0;
            border: 2px solid #7b5f3a;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #2d1f0f;
            cursor: pointer;
            outline: none;
            margin-bottom: 12px;
        }
        .ai-timer {
            background: #3e5d4c;
            color: #efdfb7;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            box-shadow: inset 0 -2px 0 #1d3327;
        }
        .ai-timer.thinking {
            background: #b02b2b;
            animation: pulse 1s infinite;
        }
        .check-warning {
            background: #d9534f;
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            animation: blink 0.5s infinite alternate;
        }
        .game-footer {
            text-align: center;
            color: #8b7355;
            font-size: 11px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #c2aa88;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        /* 自定义弹窗样式 */
        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: #f0e2c5;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            animation: modalSlideIn 0.3s ease-out;
        }
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 2px solid #baa07a;
            background: #e8d5b5;
            border-radius: 20px 20px 0 0;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1.3rem;
            color: #3b2c18;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #3b2c18;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.2s;
        }
        .modal-close:hover {
            background: rgba(59, 44, 24, 0.1);
        }
        .modal-body {
            padding: 24px 20px;
            color: #3b2c18;
            font-size: 1rem;
            line-height: 1.6;
        }
        .modal-body p {
            margin: 0;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid #baa07a;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid;
            cursor: pointer;
            transition: 0.2s;
            min-width: 80px;
        }
        .modal-btn-cancel {
            background: #f5e7cc;
            border-color: #8b6f48;
            color: #3b2c18;
        }
        .modal-btn-cancel:hover {
            background: #e8d5b5;
        }
        .modal-btn-confirm {
            background: #3e5d4c;
            border-color: #2d4235;
            color: #efdfb7;
        }
        .modal-btn-confirm:hover {
            background: #4a6d5a;
        }

        /* 游戏结束弹窗样式 */
        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            backdrop-filter: blur(5px);
        }
        .game-over-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .game-over-content {
            background: linear-gradient(135deg, #f0e2c5 0%, #e8d5b5 100%);
            border-radius: 30px;
            padding: 40px 50px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 5px #baa07a;
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: gameOverPopIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        @keyframes gameOverPopIn {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.05) rotate(2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .game-over-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        .game-over-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: iconBounce 0.6s ease-out 0.3s both;
            position: relative;
            z-index: 1;
        }
        @keyframes iconBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .game-over-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .game-over-title.red-win {
            color: #c41e3a;
        }
        .game-over-title.black-win {
            color: #1a1a1a;
        }
        .game-over-title.draw {
            color: #8b4513;
        }
        .game-over-message {
            font-size: 1.2rem;
            color: #5d4a2e;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .game-over-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .game-over-btn {
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }
        .game-over-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .game-over-btn:active {
            transform: translateY(-1px);
        }
        .game-over-btn-primary {
            background: linear-gradient(135deg, #3e5d4c 0%, #2d4235 100%);
            border-color: #1d3327;
            color: #efdfb7;
        }
        .game-over-btn-secondary {
            background: linear-gradient(135deg, #f5e7cc 0%, #e8d5b5 100%);
            border-color: #8b6f48;
            color: #3b2c18;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall 3s linear forwards;
            z-index: 0;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }

        /* AI难度选择弹窗样式 */
        .difficulty-content {
            background: linear-gradient(135deg, #f0e2c5 0%, #e8d5b5 100%);
            border-radius: 30px;
            padding: 40px 50px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 5px #baa07a;
            max-width: 600px;
            width: 90%;
            text-align: center;
            animation: gameOverPopIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        .difficulty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .difficulty-title {
            font-size: 2rem;
            font-weight: bold;
            color: #3b2c18;
            margin-bottom: 10px;
        }
        .difficulty-message {
            font-size: 1.1rem;
            color: #5d4e3a;
            margin-bottom: 30px;
        }
        .difficulty-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .difficulty-option {
            background: linear-gradient(135deg, #fff8f0 0%, #f5e7cc 100%);
            border: 3px solid #baa07a;
            border-radius: 20px;
            padding: 20px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .difficulty-option:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-color: #8b6f48;
        }
        .difficulty-option:active {
            transform: translateY(-2px) scale(1.02);
        }
        .difficulty-option-icon {
            font-size: 2.5rem;
        }
        .difficulty-option-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #3b2c18;
        }
        .difficulty-option-desc {
            font-size: 0.9rem;
            color: #6d5e4a;
        }

        /* 主菜单样式 */
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2b5a3a 0%, #1a3d2a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-container {
            text-align: center;
            background: rgba(232, 213, 181, 0.95);
            border-radius: 32px;
            padding: 48px 64px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }

        .logo-section {
            margin-bottom: 48px;
        }

        .chess-pieces {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .piece {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            font-family: 'KaiTi', '楷体', serif;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 3px solid #6f4f2e;
        }

        .red-piece {
            background: linear-gradient(135deg, #cf4a4a 0%, #b02b2b 100%);
            color: #fbf3d5;
        }

        .black-piece {
            background: linear-gradient(135deg, #2f4f4f 0%, #1e3a3a 100%);
            color: #fbf3d5;
        }

        .vs-text {
            font-size: 48px;
            font-weight: bold;
            color: #cf4a4a;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 4px;
        }

        .game-title {
            font-size: 56px;
            color: #3d2a1a;
            margin: 0 0 12px 0;
            font-family: 'KaiTi', '楷体', serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 18px;
            color: #6b5b4f;
            margin: 0;
            font-weight: 500;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 48px;
        }

        .menu-btn {
            padding: 16px 32px;
            font-size: 20px;
            border: none;
            border-radius: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-weight: 600;
            background: #cfb691;
            color: #3d2a1a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .primary-btn {
            background: linear-gradient(135deg, #cf4a4a 0%, #b02b2b 100%);
            color: #fbf3d5;
            font-size: 24px;
            padding: 20px 40px;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #d95a5a 0%, #c03b3b 100%);
        }

        .copyright {
            font-size: 14px;
            color: #8b7355;
            border-top: 1px solid #c2aa88;
            padding-top: 16px;
        }

        /* 设置界面样式 */
        .settings-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2b5a3a 0%, #1a3d2a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
        }

        .settings-container {
            background: rgba(232, 213, 181, 0.95);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #c2aa88;
        }

        .settings-header h2 {
            margin: 0;
            color: #3d2a1a;
            font-size: 28px;
        }

        .back-btn {
            background: #cfb691;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            color: #3d2a1a;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #dec7a1;
        }

        .import-btn {
            background: #3e5d4c;
            color: #efdfb7;
            border: 2px solid #2d4235;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 14px;
        }

        .import-btn:hover {
            background: #4a6b5a;
            transform: translateY(-1px);
        }

        .settings-content {
            margin-bottom: 24px;
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section h3 {
            color: #3d2a1a;
            font-size: 20px;
            margin-bottom: 16px;
            border-left: 4px solid #cf4a4a;
            padding-left: 12px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0d0b0;
        }

        .setting-item label:first-child {

            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #cf4a4a;

        .toggle-switch input:checked + .toggle-slider:before {

<script>
// 自定义弹窗管理
let modalConfirmCallback = null;

function showModal(title, message, showCancel = false, onConfirm = null) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    
    const cancelBtn = document.querySelector('.modal-btn-cancel');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    
    if (showCancel) {
        cancelBtn.style.display = 'inline-block';
        modalConfirmCallback = onConfirm;
        confirmBtn.onclick = function() {
            if (modalConfirmCallback) {
                modalConfirmCallback();
            }
            closeModal();
        };
    } else {
        cancelBtn.style.display = 'none';
        modalConfirmCallback = null;
        confirmBtn.onclick = closeModal;
    }
    
    document.getElementById('customModal').style.display = 'flex';
}

function closeModal() {
    playSfx('click');
    document.getElementById('customModal').style.display = 'none';
    modalConfirmCallback = null;
}

// 游戏结束弹窗管理
function showGameOverModal(result, message, checkmateType) {
    const modal = document.getElementById('gameOverModal');
    const icon = document.getElementById('gameOverIcon');
    const title = document.getElementById('gameOverTitle');
    const msg = document.getElementById('gameOverMessage');
    const content = document.getElementById('gameOverContent');
    const checkmateEl = document.getElementById('gameOverCheckmate');

    if (result === 'draw') {
        playSfx('draw');
    } else if (result === 'red-win') {
        playSfx('win');
    } else if (result === 'ai-win' || result === 'black-win') {
        playSfx('lose');
    }
    
    // 清除之前的彩纸
    const oldConfetti = modal.querySelectorAll('.confetti');
    oldConfetti.forEach(c => c.remove());
    
    // 重置动画
    content.style.animation = 'none';
    content.offsetHeight; // 触发重排
    content.style.animation = 'gameOverPopIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
    
    // 显示杀法类型
    if (checkmateType && checkmateType !== '将死') {
        checkmateEl.style.display = 'block';
        checkmateEl.textContent = '🏷️ ' + checkmateType;
    } else {
        checkmateEl.style.display = 'none';
    }
    
    // 根据结果显示不同的内容
    if (result === 'red-win') {
        icon.textContent = '🔴';
        title.textContent = '红方胜利！';
        title.className = 'game-over-title red-win';
        msg.textContent = message || '恭喜红方获得胜利！';
        createConfetti(modal, ['#c41e3a', '#ff6b6b', '#ffd93d']);
    } else if (result === 'black-win') {
        icon.textContent = '⚫';
        title.textContent = '黑方胜利！';
        title.className = 'game-over-title black-win';
        msg.textContent = message || '恭喜黑方获得胜利！';
        createConfetti(modal, ['#1a1a1a', '#4a4a4a', '#ffd93d']);
    } else if (result === 'draw') {
        icon.textContent = '🤝';
        title.textContent = '和局！';
        title.className = 'game-over-title draw';
        msg.textContent = message || '双方势均力敌，和棋收场！';
    } else if (result === 'ai-win') {
        icon.textContent = '🤖';
        title.textContent = 'AI胜利！';
        title.className = 'game-over-title black-win';
        msg.textContent = message || 'AI技高一筹，再接再厉！';
        createConfetti(modal, ['#1a1a1a', '#4a4a4a', '#ffd93d']);
    }
    
    modal.classList.add('show');
}

function closeGameOverModal() {
    playSfx('click');
    const modal = document.getElementById('gameOverModal');
    modal.classList.remove('show');
    disableGameControls();
}

function disableGameControls() {
    const saveFenBtn = document.getElementById('saveFenBtn');
    const loadFenBtn = document.getElementById('loadFenBtn');
    const hintBtn = document.getElementById('hintBtn');
    const regretBtn = document.getElementById('regretBtn');
    const drawBtn = document.getElementById('drawBtn');
    const restartBtn = document.getElementById('restartBtn');
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    
    [saveFenBtn, loadFenBtn, hintBtn, regretBtn, drawBtn].forEach(btn => {
        if (btn) {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        }
    });
}

function enableGameControls() {
    const saveFenBtn = document.getElementById('saveFenBtn');
    const loadFenBtn = document.getElementById('loadFenBtn');
    const hintBtn = document.getElementById('hintBtn');
    const regretBtn = document.getElementById('regretBtn');
    const drawBtn = document.getElementById('drawBtn');
    const restartBtn = document.getElementById('restartBtn');
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    
    [saveFenBtn, loadFenBtn, hintBtn, regretBtn, drawBtn].forEach(btn => {
        if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
        }
    });

let audioContext = null;
let audioMaster = null;
let audioFxBus = null;
let audioFxDelay = null;
let audioFxFeedback = null;
let audioCompressor = null;
let noiseBuffer = null;

function updateAudioSettings() {
    if (!audioMaster) return;
    const enabled = gameSettings.soundEnabled !== false;
    const vol = Number(gameSettings.soundVolume ?? 0.6);
    const clamped = Number.isFinite(vol) ? Math.min(1, Math.max(0, vol)) : 0.6;
    audioMaster.gain.value = enabled ? clamped * 0.65 : 0;
    if (audioFxBus) {
        audioFxBus.gain.value = enabled ? clamped * 0.35 : 0;
    }
}

function ensureAudioReady() {
    if (!gameSettings.soundEnabled) return false;
    if (audioContext) return true;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return false;
    audioContext = new Ctx();
    audioCompressor = audioContext.createDynamicsCompressor();
    audioCompressor.threshold.value = -18;
    audioCompressor.knee.value = 24;
    audioCompressor.ratio.value = 6;
    audioCompressor.attack.value = 0.003;
    audioCompressor.release.value = 0.12;
    
    audioMaster = audioContext.createGain();
    
    audioFxBus = audioContext.createGain();
    audioFxBus.gain.value = 0.35;
    
    audioFxDelay = audioContext.createDelay(1.0);
    audioFxDelay.delayTime.value = 0.085;
    audioFxFeedback = audioContext.createGain();
    audioFxFeedback.gain.value = 0.22;
    const fxFilter = audioContext.createBiquadFilter();
    fxFilter.type = 'lowpass';
    fxFilter.frequency.value = 2600;
    fxFilter.Q.value = 0.7;
    
    audioFxBus.connect(audioFxDelay);
    audioFxDelay.connect(fxFilter);
    fxFilter.connect(audioFxFeedback);
    audioFxFeedback.connect(audioFxDelay);
    fxFilter.connect(audioCompressor);
    
    audioMaster.connect(audioCompressor);
    audioCompressor.connect(audioContext.destination);
    updateAudioSettings();
    return true;
}

function getNoiseBuffer() {
    if (!audioContext) return null;
    if (noiseBuffer) return noiseBuffer;
    const ctx = audioContext;
    const seconds = 1.0;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1);
    }
    noiseBuffer = buffer;
    return noiseBuffer;
}

function scheduleGainEnvelope(g, t0, peak, tAttack, tRelease) {
    const safePeak = Math.max(0.0001, Math.min(1, peak));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(safePeak, t0 + tAttack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + tAttack + tRelease);
}

function playTone(freq, durationMs, type, gain, at, toFx) {
    if (!ensureAudioReady()) return;
    const ctx = audioContext;
    if (!ctx) return;
    if (ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
    }

    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g);
    g.connect(toFx ? audioFxBus : audioMaster);

    const now = ctx.currentTime;
    const t0 = now + (at || 0);
    const duration = durationMs / 1000;
    scheduleGainEnvelope(g, t0, gain || 0.18, 0.004, Math.max(0.02, duration));
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
}

function playNoise(durationMs, band, q, gain, at, toFx) {
    if (!ensureAudioReady()) return;
    const ctx = audioContext;
    if (!ctx) return;
    if (ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
    }
    const buf = getNoiseBuffer();
    if (!buf) return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = band;
    filter.Q.value = q;
    const g = ctx.createGain();
    g.gain.value = 0;
    src.connect(filter);
    filter.connect(g);
    g.connect(toFx ? audioFxBus : audioMaster);
    const now = ctx.currentTime;
    const t0 = now + (at || 0);
    const duration = durationMs / 1000;
    scheduleGainEnvelope(g, t0, gain, 0.002, Math.max(0.02, duration));
    src.start(t0);
    src.stop(t0 + duration + 0.03);
}

// 开始游戏函数
function startGame() {
    playSfx('click');
    // 检查是否有未完成的对局
    const savedGame = localStorage.getItem('currentGame');
    if (savedGame) {
        try {
            const gameState = JSON.parse(savedGame);
            // 如果对局未完成且已有走子记录
            if (!gameState.gameOver && gameState.moveList && gameState.moveList.length > 0) {
                showModal('确认', '检测到未完成的对局，开始新游戏将清空当前对局进度。是否继续？', true, () => {
                    // 用户确认开始新游戏
                    showDifficultyModal();
                });
                return;
            }
        } catch (error) {
            // 解析失败，忽略错误直接开始新游戏
            showDifficultyModal();
            return;
        }
    }
    
    // 没有未完成的对局，直接显示难度选择
    showDifficultyModal();
}

    return (piece1 >= 'A' && piece1 <= 'Z') === (piece2 >= 'A' && piece2 <= 'Z');
}

function isValidAttack(board, piece, fromRow, fromCol, toRow, toCol) {
    if (fromRow === toRow && fromCol === toCol) return false;
    const p = piece.toLowerCase();
    const deltaRow = toRow - fromRow;
    const deltaCol = toCol - fromCol;
    const stepRow = deltaRow === 0 ? 0 : (deltaRow > 0 ? 1 : -1);
    const stepCol = deltaCol === 0 ? 0 : (deltaCol > 0 ? 1 : -1);
    const targetPiece = board[toRow][toCol];
    
    if (targetPiece && sameColor(piece, targetPiece)) return false;

    if (p === 'r') {
        if (fromRow !== toRow && fromCol !== toCol) return false;
        let r = fromRow + stepRow, c = fromCol + stepCol;
        while (r !== toRow || c !== toCol) {
            if (board[r][c] !== EMPTY) return false;
            r += stepRow; c += stepCol;
        }
        return true;
    }
    if (p === 'n') {
        let legalMoves = [
            [-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]
        ];
        for (let [dr,dc] of legalMoves) {
            if (fromRow+dr === toRow && fromCol+dc === toCol) {
                if (Math.abs(dr) === 2) {
                    if (board[fromRow + (dr>0?1:-1)][fromCol] !== EMPTY) return false;
                } else {
                    if (board[fromRow][fromCol + (dc>0?1:-1)] !== EMPTY) return false;
                }
                return true;
            }
        }
        return false;
    }

    function getCheckThreats(board, color) {
        let threats = [];
        let kingRow, kingCol;
        const kingPiece = (color === 'red') ? 'K' : 'k';
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                if (board[r][c] === kingPiece) {
                    kingRow = r; kingCol = c;
                }
            }
        }
        // 如果找不到国王，返回空数组（避免undefined错误）
        if (kingRow === undefined || kingCol === undefined) {
            return threats;
        }
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const piece = board[r][c];
                if (piece && getPieceColor(piece) !== color) {
                    if (isValidAttack(board, piece, r, c, kingRow, kingCol)) {
                        threats.push({
                            piece: piece,
                            fromRow: r,
                            fromCol: c,
                            toRow: kingRow,
                            toCol: kingCol
                        });
                    }
                }
            }
        }
        return threats;
    }

    function getCheckThreats(board, color) {
        let threats = [];
        let kingRow, kingCol;
        const kingPiece = (color === 'red') ? 'K' : 'k';
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                if (board[r][c] === kingPiece) {
                    kingRow = r; kingCol = c;
                }
            }
        }
        // 如果找不到国王，返回空数组（避免undefined错误）
        if (kingRow === undefined || kingCol === undefined) {
            return threats;
        }
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const piece = board[r][c];
                if (piece && getPieceColor(piece) !== color) {
                    if (isValidAttack(board, piece, r, c, kingRow, kingCol)) {
                        threats.push({
                            piece: piece,
                            fromRow: r,
                            fromCol: c,
                            toRow: kingRow,
                            toCol: kingCol
                        });
                    }
                }
            }
        }
        return threats;
    }
    if (p === 'b') {
        if (Math.abs(deltaRow) !== 2 || Math.abs(deltaCol) !== 2) return false;
        if (board[fromRow + (deltaRow>0?1:-1)][fromCol + (deltaCol>0?1:-1)] !== EMPTY) return false;
        if (piece === 'B' && toRow < 5) return false;
        if (piece === 'b' && toRow > 4) return false;
        return true;
    }
    if (p === 'a') {
        if (Math.abs(deltaRow)!==1 || Math.abs(deltaCol)!==1) return false;
        if (piece === 'A' && (toCol<3 || toCol>5 || toRow<7)) return false;
        if (piece === 'a' && (toCol<3 || toCol>5 || toRow>2)) return false;
        return true;
    }
    if (p === 'k') {
        if (Math.abs(deltaRow) + Math.abs(deltaCol) !== 1) return false;
        if (piece === 'K' && (toCol<3 || toCol>5 || toRow<7)) return false;
        if (piece === 'k' && (toCol<3 || toCol>5 || toRow>2)) return false;
        return true;
    }
    if (p === 'c') {
            if (fromRow !== toRow && fromCol !== toCol) return false;
            let cnt = 0;
            let r = fromRow + stepRow, c = fromCol + stepCol;
            while (r !== toRow || c !== toCol) {
                if (board[r][c] !== EMPTY) cnt++;
                r += stepRow; c += stepCol;
            }
            // 炮只有在吃子的时候才攻击，此时需要中间有一个棋子
            if (targetPiece !== EMPTY) return cnt === 1;
            return cnt === 0;
        }
    if (p === 'p') {
        if (piece === 'P') {
            if (toRow < fromRow && deltaCol === 0 && toRow === fromRow - 1) return true;
            if (fromRow <= 4 && toRow === fromRow && Math.abs(deltaCol) === 1) return true;
            return false;
        }
        if (piece === 'p') {
            if (toRow > fromRow && deltaCol === 0 && toRow === fromRow + 1) return true;
            if (fromRow >= 5 && toRow === fromRow && Math.abs(deltaCol) === 1) return true;
            return false;
        }
    }
    return false;
}

function kingsFacing(board) {
    let redKingPos, blackKingPos;
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            const p = board[r][c];
            if (p === 'K') redKingPos = [r,c];
            if (p === 'k') blackKingPos = [r,c];
        }
    }
    if (!redKingPos || !blackKingPos) return false;
    if (redKingPos[1] !== blackKingPos[1]) return false;
    let col = redKingPos[1];
    let minRow = Math.min(redKingPos[0], blackKingPos[0]);
    let maxRow = Math.max(redKingPos[0], blackKingPos[0]);
    for (let r = minRow+1; r < maxRow; r++) {
        if (board[r][col] !== EMPTY) return false;
    }
    return true;
}

function isInCheck(board, color) {
    let kingRow, kingCol;
    const kingPiece = (color === 'red') ? 'K' : 'k';
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            if (board[r][c] === kingPiece) {
                kingRow = r; kingCol = c;
            }
        }
    }
    if (kingRow === undefined || kingCol === undefined) return false;
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            const piece = board[r][c];
            if (piece && getPieceColor(piece) !== color) {
                if (isValidAttack(board, piece, r, c, kingRow, kingCol)) {
                    return true;
                }
            }
        }
    }
    return false;
}

function isSquareAttacked(board, row, col, attackerColor) {
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            const piece = board[r][c];
            if (!piece) continue;
            if (getPieceColor(piece) !== attackerColor) continue;
            if (isValidAttack(board, piece, r, c, row, col)) return true;
        }
    }
    return false;
}

function makeMove(board, move) {
    const piece = board[move.fromRow][move.fromCol];
    const captured = board[move.toRow][move.toCol];
    board[move.fromRow][move.fromCol] = EMPTY;
    board[move.toRow][move.toCol] = piece;
    return captured;
}

function unmakeMove(board, move, captured) {
    board[move.fromRow][move.fromCol] = move.piece;
    board[move.toRow][move.toCol] = captured;
}

function moveLeavesSelfInCheck(board, move, color) {
    const captured = makeMove(board, move);
    const bad = isInCheck(board, color) || kingsFacing(board);
    unmakeMove(board, move, captured);
    return bad;
}

function inPalace(color, row, col) {
    if (col < 3 || col > 5) return false;
    if (color === 'red') return row >= 7 && row <= 9;
    return row >= 0 && row <= 2;
}

function generatePseudoMovesForPiece(board, fromRow, fromCol, piece, outMoves) {
    const color = getPieceColor(piece);
    const p = piece.toLowerCase();

    function push(toRow, toCol) {
        if (toRow < 0 || toRow >= ROWS || toCol < 0 || toCol >= COLS) return;
        const target = board[toRow][toCol];
        if (target && sameColor(piece, target)) return;
        outMoves.push({ fromRow, fromCol, toRow, toCol, piece });
    }

    if (p === 'r') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i=0; i<dirs.length; i++) {
            const dr = dirs[i][0], dc = dirs[i][1];
            let r = fromRow + dr, c = fromCol + dc;
            while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                const target = board[r][c];
                if (!target) {
                    push(r, c);
                } else {
                    if (!sameColor(piece, target)) push(r, c);
                    break;
                }
                r += dr; c += dc;
            }
        }
        return;
    }

    if (p === 'c') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i=0; i<dirs.length; i++) {
            const dr = dirs[i][0], dc = dirs[i][1];
            let r = fromRow + dr, c = fromCol + dc;
            while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === EMPTY) {
                push(r, c);
                r += dr; c += dc;
            }
            while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === EMPTY) {
                r += dr; c += dc;
            }
            r += dr; c += dc;
            while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                const target = board[r][c];
                if (target !== EMPTY) {
                    if (!sameColor(piece, target)) push(r, c);
                    break;
                }
                r += dr; c += dc;
            }
        }
        return;
    }

    if (p === 'n') {
        const candidates = [
            [-2,-1,-1,0],[-2,1,-1,0], [2,-1,1,0],[2,1,1,0],
            [-1,-2,0,-1],[1,-2,0,-1], [-1,2,0,1],[1,2,0,1]
        ];
        for (let i=0; i<candidates.length; i++) {
            const dr = candidates[i][0], dc = candidates[i][1];
            const lr = candidates[i][2], lc = candidates[i][3];
            const legRow = fromRow + lr, legCol = fromCol + lc;
            if (legRow < 0 || legRow >= ROWS || legCol < 0 || legCol >= COLS) continue;
            if (board[legRow][legCol] !== EMPTY) continue;
            push(fromRow + dr, fromCol + dc);
        }
        return;
    }

    if (p === 'b') {
        const dirs = [[-2,-2],[-2,2],[2,-2],[2,2]];
        for (let i=0; i<dirs.length; i++) {
            const dr = dirs[i][0], dc = dirs[i][1];
            const eyeRow = fromRow + dr/2, eyeCol = fromCol + dc/2;
            const toRow = fromRow + dr, toCol = fromCol + dc;
            if (toRow < 0 || toRow >= ROWS || toCol < 0 || toCol >= COLS) continue;
            if (board[eyeRow][eyeCol] !== EMPTY) continue;
            if (color === 'red' && toRow < 5) continue;
            if (color === 'black' && toRow > 4) continue;
            push(toRow, toCol);
        }
        return;
    }

    if (p === 'a') {
        const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
        for (let i=0; i<dirs.length; i++) {
            const toRow = fromRow + dirs[i][0], toCol = fromCol + dirs[i][1];
            if (!inPalace(color, toRow, toCol)) continue;
            push(toRow, toCol);
        }
        return;
    }

    if (p === 'k') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i=0; i<dirs.length; i++) {
            const toRow = fromRow + dirs[i][0], toCol = fromCol + dirs[i][1];
            if (!inPalace(color, toRow, toCol)) continue;
            push(toRow, toCol);
        }
        return;
    }

    if (p === 'p') {
        if (color === 'red') {
            push(fromRow - 1, fromCol);
            if (fromRow <= 4) {
                push(fromRow, fromCol - 1);
                push(fromRow, fromCol + 1);
            }
        } else {
            push(fromRow + 1, fromCol);
            if (fromRow >= 5) {
                push(fromRow, fromCol - 1);
                push(fromRow, fromCol + 1);
            }
        }
        return;
    }
}

function getAllLegalMoves(board, color) {
    const pseudo = [];
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            const piece = board[r][c];
            if (!piece) continue;
            if (getPieceColor(piece) !== color) continue;
            generatePseudoMovesForPiece(board, r, c, piece, pseudo);
        }
    }

    const legal = [];
    for (let i=0; i<pseudo.length; i++) {
        const m = pseudo[i];
        if (!moveLeavesSelfInCheck(board, m, color)) legal.push(m);
    }
    return legal;
}

const pieceValues = {
    'k': 100000, 'a': 250, 'b': 250, 'n': 450, 'r': 1000, 'c': 500, 'p': 100,
    'K': 100000, 'A': 250, 'B': 250, 'N': 450, 'R': 1000, 'C': 500, 'P': 100
};

function getPosBonus(piece, row, col) {
    const p = piece.toLowerCase();
    if (p === 'p') {
        if (piece === 'P') {
            if (row <= 4) return 20;
            return (9 - row) * 10;
        } else {
            if (row >= 5) return 20;
            return row * 10;
        }
    }
    if (p === 'n') {
        const centerBonus = (4 - Math.abs(row - 4.5)) + (4 - Math.abs(col - 4));
        return centerBonus * 5;
    }
    if (p === 'r' || p === 'c') {
        const centerBonus = (4 - Math.abs(row - 4.5)) + (4 - Math.abs(col - 4));
        return centerBonus * 3;
    }
    return 0;
}

function buildMobilityMap(moves) {
    const map = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    for (let i = 0; i < moves.length; i++) {
        const m = moves[i];
        map[m.fromRow][m.fromCol] += 1;
    }
    return map;
}

function canCaptureAssumingEnemy(board, piece, fromRow, fromCol, toRow, toCol) {
    if (fromRow === toRow && fromCol === toCol) return false;
    const p = piece.toLowerCase();
    if (p === 'c') {
        if (fromRow !== toRow && fromCol !== toCol) return false;
        const deltaRow = toRow - fromRow;
        const deltaCol = toCol - fromCol;
        const stepRow = deltaRow === 0 ? 0 : (deltaRow > 0 ? 1 : -1);
        const stepCol = deltaCol === 0 ? 0 : (deltaCol > 0 ? 1 : -1);
        let cnt = 0;
        let r = fromRow + stepRow, c = fromCol + stepCol;
        while (r !== toRow || c !== toCol) {
            if (board[r][c] !== EMPTY) cnt++;
            r += stepRow; c += stepCol;
        }
        return cnt === 1;
    }
    const saved = board[toRow][toCol];
    board[toRow][toCol] = EMPTY;
    const ok = isValidAttack(board, piece, fromRow, fromCol, toRow, toCol);
    board[toRow][toCol] = saved;
    return ok;
}

function buildCaptureMap(board, attackerColor) {
    const cap = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const piece = board[r][c];
            if (!piece) continue;
            if (getPieceColor(piece) !== attackerColor) continue;
            for (let tr = 0; tr < ROWS; tr++) {
                for (let tc = 0; tc < COLS; tc++) {
                    const target = board[tr][tc];
                    if (!target) continue;
                    if (sameColor(piece, target)) continue;
                    if (isValidAttack(board, piece, r, c, tr, tc)) {
                        cap[tr][tc] = true;
                    }
                }
            }
        }
    }
    return cap;
}

function buildPressureMap(board, attackerColor) {
    const press = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const piece = board[r][c];
            if (!piece) continue;
            if (getPieceColor(piece) !== attackerColor) continue;
            for (let tr = 0; tr < ROWS; tr++) {
                for (let tc = 0; tc < COLS; tc++) {
                    if (r === tr && c === tc) continue;
                    if (canCaptureAssumingEnemy(board, piece, r, c, tr, tc)) {
                        press[tr][tc] = true;
                    }
                }
            }
        }
    }
    return press;
}

function evaluateBoard(b) {
    let score = 0;

    function buildInfluenceMap(board, color) {
        const inf = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        function mark(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
            inf[r][c] = true;
        }
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const piece = board[r][c];
                if (!piece) continue;
                if (getPieceColor(piece) !== color) continue;
                const p = piece.toLowerCase();

                if (p === 'r') {
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (let i=0; i<dirs.length; i++) {
                        const dr = dirs[i][0], dc = dirs[i][1];
                        let rr = r + dr, cc = c + dc;
                        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
                            mark(rr, cc);
                            if (board[rr][cc] !== EMPTY) break;
                            rr += dr; cc += dc;
                        }
                    }
                    continue;
                }

                if (p === 'c') {
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (let i=0; i<dirs.length; i++) {
                        const dr = dirs[i][0], dc = dirs[i][1];
                        let rr = r + dr, cc = c + dc;
                        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr][cc] === EMPTY) {
                            rr += dr; cc += dc;
                        }
                        if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
                        rr += dr; cc += dc;
                        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
                            if (board[rr][cc] !== EMPTY) {
                                mark(rr, cc);
                                break;
                            }
                            rr += dr; cc += dc;
                        }
                    }
                    continue;
                }

                if (p === 'n') {
                    const candidates = [
                        [-2,-1,-1,0],[-2,1,-1,0], [2,-1,1,0],[2,1,1,0],
                        [-1,-2,0,-1],[1,-2,0,-1], [-1,2,0,1],[1,2,0,1]
                    ];
                    for (let i=0; i<candidates.length; i++) {
                        const dr = candidates[i][0], dc = candidates[i][1];
                        const lr = candidates[i][2], lc = candidates[i][3];
                        const legRow = r + lr, legCol = c + lc;
                        if (legRow < 0 || legRow >= ROWS || legCol < 0 || legCol >= COLS) continue;
                        if (board[legRow][legCol] !== EMPTY) continue;
                        mark(r + dr, c + dc);
                    }
                    continue;
                }

                if (p === 'b') {
                    const dirs = [[-2,-2],[-2,2],[2,-2],[2,2]];
                    for (let i=0; i<dirs.length; i++) {
                        const dr = dirs[i][0], dc = dirs[i][1];
                        const eyeRow = r + dr/2, eyeCol = c + dc/2;
                        const toRow = r + dr, toCol = c + dc;
                        if (toRow < 0 || toRow >= ROWS || toCol < 0 || toCol >= COLS) continue;
                        if (board[eyeRow][eyeCol] !== EMPTY) continue;
                        if (color === 'red' && toRow < 5) continue;
                        if (color === 'black' && toRow > 4) continue;
                        mark(toRow, toCol);
                    }
                    continue;
                }

                if (p === 'a') {
                    const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
                    for (let i=0; i<dirs.length; i++) {
                        const toRow = r + dirs[i][0], toCol = c + dirs[i][1];
                        if (!inPalace(color, toRow, toCol)) continue;
                        mark(toRow, toCol);
                    }
                    continue;
                }

                if (p === 'k') {
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (let i=0; i<dirs.length; i++) {
                        const toRow = r + dirs[i][0], toCol = c + dirs[i][1];
                        if (!inPalace(color, toRow, toCol)) continue;
                        mark(toRow, toCol);
                    }
                    continue;
                }

                if (p === 'p') {
                    if (color === 'red') {
                        mark(r - 1, c);
                        if (r <= 4) { mark(r, c - 1); mark(r, c + 1); }
                    } else {
                        mark(r + 1, c);
                        if (r >= 5) { mark(r, c - 1); mark(r, c + 1); }
                    }
                }
            }
        }
        return inf;
    }

    const redInf = buildInfluenceMap(b, 'red');
    const blackInf = buildInfluenceMap(b, 'black');

    let redKing, blackKing;
    for (let r=0; r<ROWS; r++) {
        for (let c=0; c<COLS; c++) {
            const p = b[r][c];
            if (p === 'K') redKing = [r,c];
            if (p === 'k') blackKing = [r,c];
        }
    }

    function mobilityCountForPiece(board, r, c, piece) {
        const tmp = [];
        generatePseudoMovesForPiece(board, r, c, piece, tmp);
        return tmp.length;
    }

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const p = b[r][c];
            if (!p) continue;
            const color = getPieceColor(p);
            const base = pieceValues[p] || 0;
            let val = base + getPosBonus(p, r, c);
            val += mobilityCountForPiece(b, r, c, p) * 2;

            const attacked = color === 'red' ? blackInf[r][c] : redInf[r][c];
            const defended = color === 'red' ? redInf[r][c] : blackInf[r][c];
            if (attacked) val -= defended ? base * 0.16 : base * 0.38;
            if (defended && !attacked) val += base * 0.03;

            score += (color === 'red') ? val : -val;
        }
    }

    if (redKing) {
        const kr = redKing[0], kc = redKing[1];
        let danger = 0;
        for (let r = Math.max(0, kr - 1); r <= Math.min(ROWS - 1, kr + 1); r++) {
            for (let c = Math.max(0, kc - 1); c <= Math.min(COLS - 1, kc + 1); c++) {
                if (blackInf[r][c] && inPalace('red', r, c)) danger++;
            }
        }
        score -= danger * 60;
    }
    if (blackKing) {
        const kr = blackKing[0], kc = blackKing[1];
        let danger = 0;
        for (let r = Math.max(0, kr - 1); r <= Math.min(ROWS - 1, kr + 1); r++) {
            for (let c = Math.max(0, kc - 1); c <= Math.min(COLS - 1, kc + 1); c++) {
                if (redInf[r][c] && inPalace('black', r, c)) danger++;
            }
        }
        score += danger * 70;
    }

    if (isInCheck(b, 'red')) score -= 260;
    if (isInCheck(b, 'black')) score += 300;

    if (aiStrategy === 'aggressive') score *= 1.08;
    else if (aiStrategy === 'defensive') score *= 0.93;

    return score;
}

function isCheckmate(board, color) {
    const moves = getAllLegalMoves(board, color);
    return moves.length === 0;
}

let searchDeadline = 0;

function quiescenceSearch(b, alpha, beta, isMaximizing, depth) {
    if (searchDeadline && Date.now() >= searchDeadline) {
        return evaluateBoard(b);
    }
    const standPat = evaluateBoard(b);
    
    if (isMaximizing) {
        if (standPat >= beta) return beta;
        if (alpha < standPat) alpha = standPat;
    } else {
        if (standPat <= alpha) return alpha;
        if (beta > standPat) beta = standPat;
    }
    
    if (depth === 0) return standPat;
    
    const color = isMaximizing ? 'red' : 'black';
    const moves = getAllLegalMoves(b, color);
    
    const captureMoves = moves.filter(m => b[m.toRow][m.toCol] !== EMPTY);
    captureMoves.sort((a, bb) => (pieceValues[b[bb.toRow][bb.toCol]] || 0) - (pieceValues[b[a.toRow][a.toCol]] || 0));
    
    if (isMaximizing) {
        for (let move of captureMoves) {
            const capturedValue = pieceValues[b[move.toRow][move.toCol]] || 0;
            if (standPat + capturedValue + 200 < alpha) continue;

            const captured = makeMove(b, move);
            const score = quiescenceSearch(b, alpha, beta, false, depth - 1);
            unmakeMove(b, move, captured);
            if (score >= beta) return beta;
            if (score > alpha) alpha = score;
        }
        return alpha;
    } else {
        for (let move of captureMoves) {
            const capturedValue = pieceValues[b[move.toRow][move.toCol]] || 0;
            if (standPat - capturedValue - 200 > beta) continue;

            const captured = makeMove(b, move);
            const score = quiescenceSearch(b, alpha, beta, true, depth - 1);
            unmakeMove(b, move, captured);
            if (score <= alpha) return alpha;
            if (score < beta) beta = score;
        }
        return beta;
    }
}

function withTemporaryMove(board, move, fn) {
    const piece = board[move.fromRow][move.fromCol];
    const captured = board[move.toRow][move.toCol];
    board[move.fromRow][move.fromCol] = EMPTY;
    board[move.toRow][move.toCol] = piece;
    const result = fn();
    board[move.fromRow][move.fromCol] = piece;
    board[move.toRow][move.toCol] = captured;
    return result;
}

function scoreMoveForOrdering(board, move, moverColor) {
    let score = 0;
    const captured = board[move.toRow][move.toCol];
    if (captured) score += (pieceValues[captured] || 0) * 100;
    score += getPosBonus(move.piece, move.toRow, move.toCol) - getPosBonus(move.piece, move.fromRow, move.fromCol);
    const opponent = moverColor === 'red' ? 'black' : 'red';
    score += withTemporaryMove(board, move, () => isInCheck(board, opponent) ? 50000 : 0);
    score += withTemporaryMove(board, move, () => {
        if (isSquareAttacked(board, move.toRow, move.toCol, opponent)) {
            return -(pieceValues[move.piece] || 0) * 18;
        }
        return 0;
    });
    return score;
}

function minimax(b, depth, alpha, beta, isMaximizing, maxDepth) {
    if (searchDeadline && Date.now() >= searchDeadline) {
        return evaluateBoard(b);
    }
    if (depth === 0) {
        return quiescenceSearch(b, alpha, beta, isMaximizing, 8);
    }
    
    const color = isMaximizing ? 'red' : 'black';
    let moves = getAllLegalMoves(b, color);
    
    if (moves.length === 0) {
        return isMaximizing ? -100000 - depth : 100000 + depth;
    }
    
    const scored = new Array(moves.length);
    for (let i = 0; i < moves.length; i++) {
        scored[i] = { move: moves[i], score: scoreMoveForOrdering(b, moves[i], color) };
    }
    scored.sort((a, bb) => bb.score - a.score);
    moves = scored.map(x => x.move);
    
    if (isMaximizing) {
        let maxEval = -Infinity;
        for (let move of moves) {
            const captured = makeMove(b, move);
            const evalScore = minimax(b, depth - 1, alpha, beta, false, maxDepth);
            unmakeMove(b, move, captured);
            maxEval = Math.max(maxEval, evalScore);
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break;
        }
        return maxEval;
    } else {
        let minEval = Infinity;
        for (let move of moves) {
            const captured = makeMove(b, move);
            const evalScore = minimax(b, depth - 1, alpha, beta, true, maxDepth);
            unmakeMove(b, move, captured);
            minEval = Math.min(minEval, evalScore);
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
        }
        return minEval;
    }
}

    function pieceToChinese(piece, color) {
        if (!piece) return '';
        const lower = piece.toLowerCase();
        if (color === 'red') {
            switch(lower) {
                case 'r': return '俥';
                case 'n': return '傌';
                case 'b': return '相';
                case 'a': return '仕';
                case 'k': return '帅';
                case 'c': return '炮';
                case 'p': return '兵';
                default: return piece;
            }
        } else {
            switch(lower) {
                case 'r': return '车';
                case 'n': return '马';
                case 'b': return '象';
                case 'a': return '士';
                case 'k': return '将';
                case 'c': return '砲';
                case 'p': return '卒';
                default: return piece;
            }
        }
    }

    function colToChinese(col, isRed) {
        const redMap = ['九','八','七','六','五','四','三','二','一'];
        const blackMap = ['1','2','3','4','5','6','7','8','9'];
        return isRed ? redMap[col] : blackMap[8 - col];
    }

    function numToChinese(num, isRed) {
        if (!isRed) return num.toString();
        const chineseMap = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
        return chineseMap[num] || num.toString();
    }

    function generateNotation(move, color) {
        const { piece, fromRow, fromCol, toRow, toCol } = move;
        if (!piece) return '?';
        const isRed = (color === 'red');
        const pieceChar = pieceToChinese(piece, color);
        
        // 检查是否有相同棋子在同一纵线
        let piecePrefix = '';
        let samePieceCount = 0;
        let frontPieceRow = -1;
        let backPieceRow = -1;
        
        for (let r = 0; r < ROWS; r++) {
            if (board[r][fromCol] === piece) {
                samePieceCount++;
                if (frontPieceRow === -1 || (isRed && r < frontPieceRow) || (!isRed && r > frontPieceRow)) {
                    frontPieceRow = r;
                }
                if (backPieceRow === -1 || (isRed && r > backPieceRow) || (!isRed && r < backPieceRow)) {
                    backPieceRow = r;
                }
            }
        }
        
        // 如果有两个相同的棋子在同一纵线，使用"前"和"后"来区分
        if (samePieceCount >= 2) {
            if (fromRow === frontPieceRow) {
                piecePrefix = '前';
            } else if (fromRow === backPieceRow) {
                piecePrefix = '后';
            }
        }
        
        const startColStr = colToChinese(fromCol, isRed);
        const endColStr = colToChinese(toCol, isRed);
        
        if (toRow === fromRow) {
            return piecePrefix + pieceChar + startColStr + '平' + endColStr;
        } else {
            let direction = '';
            if (isRed) {
                direction = (toRow < fromRow) ? '进' : '退';
            } else {
                direction = (toRow > fromRow) ? '进' : '退';
            }
            
            // 对于车、炮、兵（卒），使用移动的步数
            // 对于马、象、士，使用目标列的位置
            const pieceType = piece.toLowerCase();
            let stepOrCol;
            if (pieceType === 'r' || pieceType === 'c' || pieceType === 'p') {
                // 车、炮、兵（卒）使用步数，红方用汉字数字，黑方用阿拉伯数字
                const step = Math.abs(toRow - fromRow);
                stepOrCol = numToChinese(step, isRed);
            } else {
                // 马、象、士使用目标列
                stepOrCol = endColStr;
            }
            
            return piecePrefix + pieceChar + startColStr + direction + stepOrCol;
        }
    }

    function isValidAttack(board, piece, fromRow, fromCol, toRow, toCol) {
