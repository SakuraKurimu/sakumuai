        }
        if (p === 'k') {
            if (Math.abs(deltaRow) + Math.abs(deltaCol) !== 1) return false;
            if (piece === 'K' && (toCol<3 || toCol>5 || toRow<7)) return false;
            if (piece === 'k' && (toCol<3 || toCol>5 || toRow>2)) return false;
            return true;
        }
        if (p === 'c') {
            if (fromRow !== toRow && fromCol !== toCol) return false;
            let cnt = 0;
            let r = fromRow + stepRow, c = fromCol + stepCol;
            while (r !== toRow || c !== toCol) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
                if (board[r][c] !== EMPTY) cnt++;
                r += stepRow; c += stepCol;
            }
            // 炮移动规则：不吃子时中间不能有棋子，吃子时中间必须有一个棋子
            if (targetPiece !== EMPTY) return cnt === 1;
            return cnt === 0;
        }
        if (p === 'p') {
            if (piece === 'P') {
                // 红兵向前走一步
                if (toRow < fromRow && deltaCol === 0 && toRow === fromRow - 1) return true;
                // 过河后左右走
                if (fromRow <= 4 && toRow === fromRow && Math.abs(deltaCol) === 1) return true;
                return false;
            }
            if (piece === 'p') {
                // 黑卒向前走一步
                if (toRow > fromRow && deltaCol === 0 && toRow === fromRow + 1) return true;
                // 过河后左右走
                if (fromRow >= 5 && toRow === fromRow && Math.abs(deltaCol) === 1) return true;
                return false;
            }
        }
        return false;
    }

    function moveWouldLeaveSelfInCheck(board, fromRow, fromCol, toRow, toCol, color) {
        const newBoard = copyBoard(board);
        const piece = newBoard[fromRow][fromCol];
        newBoard[fromRow][fromCol] = EMPTY;
        newBoard[toRow][toCol] = piece;
        return isInCheck(newBoard, color) || kingsFacing(newBoard);
    }

    function getAllLegalMoves(board, color) {
        let moves = [];
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const piece = board[r][c];
                if (!piece) continue;
                if (getPieceColor(piece) !== color) continue;
                for (let tr=0; tr<ROWS; tr++) {
                    for (let tc=0; tc<COLS; tc++) {
                        if (r===tr && c===tc) continue;
                        const target = board[tr][tc];
                        if (target && sameColor(piece, target)) continue;
                        if (!isValidAttack(board, piece, r, c, tr, tc)) continue;
                        if (moveWouldLeaveSelfInCheck(board, r, c, tr, tc, color)) continue;
                        moves.push({
                            fromRow: r, fromCol: c,
                            toRow: tr, toCol: tc,
                            piece: piece
                        });
                    }
                }
            }
        }
        return moves;
    }

    function detectCheckmateType(board, color) {
        const kingPiece = color === 'red' ? 'k' : 'K';
        const attackerColor = color === 'red' ? 'black' : 'red';
        let kingRow, kingCol;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] === kingPiece) {
                    kingRow = r;
                    kingCol = c;
                }
            }
        }
        
        if (kingRow === undefined) return '将死';
        
        const attackers = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const piece = board[r][c];
                if (piece && getPieceColor(piece) === attackerColor) {
                    if (isValidAttack(board, piece, r, c, kingRow, kingCol)) {
                        attackers.push({ piece, row: r, col: c });
                    }
                }
            }
        }
        
        if (attackers.length === 0) return '将死';
        
        if (attackers.length === 2) {
            return '双将';
        }
        
        const attacker = attackers[0];
        const pieceType = attacker.piece.toLowerCase();
        
        const hasCar = (color === 'red') ? 
            (board[kingRow][0] === 'r' || board[kingRow][8] === 'r') :
            (board[kingRow][0] === 'R' || board[kingRow][8] === 'R');
        
        if (pieceType === 'r') {
            if (hasCar) {
                return '臣压君';
            }
            if (attacker.col === kingCol) {
                if (attacker.row === (color === 'red' ? 0 : 9)) {
                    return '大刀剜心';
                }
            }
            let otherCar = null;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.toLowerCase() === 'r' && getPieceColor(p) === attackerColor && 
                        !(r === attacker.row && c === attacker.col)) {
                        otherCar = { row: r, col: c };
                        break;
                    }
                }
                if (otherCar) break;
            }
            if (otherCar) {
                if (attacker.row === otherCar.row) {
                    return '双车错';
                }
                if ((attacker.col === kingCol && otherCar.row === kingRow) ||
                    (otherCar.col === kingCol && attacker.row === kingRow)) {
                    return '铁门闩';
                }
            }
            return '将死';
        }
        
        if (pieceType === 'n') {
            if ((kingRow === 0 && kingCol === 4) || (kingRow === 9 && kingCol === 4)) {
                return '八角马';
            }
            const isWocaoMa = (color === 'red' && attacker.row === 7 && (attacker.col === 2 || attacker.col === 6)) ||
                              (color === 'black' && attacker.row === 2 && (attacker.col === 2 || attacker.col === 6));
            if (isWocaoMa) {
                let hasPao = false;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const p = board[r][c];
                        if (p && p.toLowerCase() === 'c' && getPieceColor(p) === attackerColor) {
                            hasPao = true;
                            break;
                        }
                    }
                    if (hasPao) break;
                }
                if (hasPao) {
                    return '马后炮';
                }
                return '卧槽马';
            }
            const isDiaoyuma = (color === 'red' && attacker.row === 8 && (attacker.col === 2 || attacker.col === 6)) ||
                               (color === 'black' && attacker.row === 1 && (attacker.col === 2 || attacker.col === 6));
            if (isDiaoyuma) return '钓鱼马';
            const isCemianhu = (color === 'red' && attacker.row === 9 && (attacker.col === 3 || attacker.col === 5)) ||
                               (color === 'black' && attacker.row === 0 && (attacker.col === 3 || attacker.col === 5));
            if (isCemianhu) return '侧面虎';
            return '将死';
        }
        
        if (pieceType === 'c') {
            let otherPao = null;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.toLowerCase() === 'c' && getPieceColor(p) === attackerColor && 
                        !(r === attacker.row && c === attacker.col)) {
                        otherPao = { row: r, col: c };
                        break;
                    }
                }
                if (otherPao) break;
            }
            if (otherPao) {
                if (attacker.row === otherPao.row || attacker.col === otherPao.col) {
                    return '重炮';
                }
                if ((attacker.row <= 4 && otherPao.row >= 5) || (attacker.row >= 5 && otherPao.row <= 4)) {
                    return '天地炮';
                }
            }
            let hasCar = false;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.toLowerCase() === 'r' && getPieceColor(p) === attackerColor) {
                        hasCar = true;
                        break;
                    }
                }
                if (hasCar) break;
            }
            if (hasCar) return '夹车炮';
            return '将死';
        }
        
        if (pieceType === 'p') {
            const isLaozushoushan = (color === 'red' && attacker.row <= 1) || 
                                    (color === 'black' && attacker.row >= 8);
            if (isLaozushoushan) return '老卒搜山';
            let pawnCount = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.toLowerCase() === 'p' && getPieceColor(p) === attackerColor) {
                        pawnCount++;
                    }
                }
            }
            if (pawnCount >= 3) {
                return '三进兵';
            }
            if (pawnCount === 2) {
                return '二鬼拍门';
            }
            if (attacker.row === kingRow && Math.abs(attacker.col - kingCol) === 1) {
                return '送佛归殿';
            }
            return '将死';
        }
        
        if (pieceType === 'r' && (kingCol === 4 && Math.abs(attacker.row - kingRow) <= 1)) {
            return '大胆穿心';
        }
        
        let otherKing = null;
        const otherKingPiece = color === 'red' ? 'K' : 'k';
        for (let r = 0; r < ROWS; r++) {
            if (board[r][kingCol] === otherKingPiece) {
                otherKing = { row: r };
                break;
            }
        }
        if (otherKing) {
            let blocked = false;
            const minRow = Math.min(otherKing.row, kingRow);
            const maxRow = Math.max(otherKing.row, kingRow);
            for (let r = minRow + 1; r < maxRow; r++) {
                if (board[r][kingCol] !== EMPTY) {
                    blocked = true;
                    break;
                }
            }
            if (!blocked) {
                return '对面笑';
            }
        }
        
        return '将死';
    }

    function isCheckmate(board, color) {
        const moves = getAllLegalMoves(board, color);
        return moves.length === 0;
    }

    function isSquareAttacked(board, row, col, byColor) {
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const piece = board[r][c];
                if (piece && getPieceColor(piece) === byColor) {
                    const pieceType = piece.toLowerCase();
                    if (pieceType === 'c') {
                        // 炮的攻击判断：需要有炮架
                        if (board[row][col] === EMPTY) {
                            continue;
                        }
                        if (r === row && c === col) {
                            continue;
                        }
                        if (r !== row && c !== col) {
                            continue;
                        }
                        let cnt = 0;
                        const stepRow = (row - r) / Math.abs(row - r) || 0;
                        const stepCol = (col - c) / Math.abs(col - c) || 0;
                        let currentR = r + stepRow;
                        let currentC = c + stepCol;
                        while (currentR !== row || currentC !== col) {
                            if (board[currentR][currentC] !== EMPTY) {
                                cnt++;
                            }
                            currentR += stepRow;
                            currentC += stepCol;
                        }
                        if (cnt === 1) {
                            return true;
                        }
                    } else {
                        if (isValidAttack(board, piece, r, c, row, col)) {
                            return true;
                        }
                    }
                }
            }
        }
        return false;
    }

    function isSquareProtected(board, row, col, byColor) {
        const tempBoard = copyBoard(board);
        tempBoard[row][col] = (byColor === 'red') ? 'P' : 'p';
        for (let r=0; r<ROWS; r++) {
            for (let c=0; c<COLS; c++) {
                const piece = tempBoard[r][c];
                if (piece && getPieceColor(piece) === byColor && !(r === row && c === col)) {
                    if (isValidAttack(tempBoard, piece, r, c, row, col)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    function getCellFromPoint(x, y) {
        const col = Math.round((x - padding) / cellSize);
        const row = Math.round((y - padding) / cellSize);
        if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
            return { row, col };
        }
        return null;
    }

    function getPointFromCell(row, col) {
        return {
            x: padding + col * cellSize,
            y: padding + row * cellSize
        };
    }

    function animateMove(fromRow, fromCol, toRow, toCol, piece, callback) {
        const startPt = getPointFromCell(fromRow, fromCol);
        const endPt = getPointFromCell(toRow, toCol);
        const startTime = Date.now();
        const duration = 300; // 动画持续时间（毫秒）
        
        // 临时清除原位置的棋子
        const originalPiece = board[fromRow][fromCol];
        board[fromRow][fromCol] = EMPTY;
        
        function animate() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // 使用缓动函数
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            
            const currentX = startPt.x + (endPt.x - startPt.x) * easeProgress;
            const currentY = startPt.y + (endPt.y - startPt.y) * easeProgress;
            
            // 重绘棋盘和棋子（不包含移动的棋子）
            drawBoard();
            
            // 绘制移动中的棋子 - 使用与drawBoard相同的样式
            ctx.beginPath();
            ctx.arc(currentX, currentY, cellSize * 0.4, 0, 2 * Math.PI);
            ctx.fillStyle = getPieceColor(piece) === 'red' ? '#cf4a4a' : '#2f4f4f';
            ctx.fill();
            ctx.strokeStyle = '#f5e6c4';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 绘制棋子文本 - 使用与drawBoard相同的样式
            ctx.font = 'bold 30px "KaiTi", serif';
            ctx.fillStyle = '#fbf3d5';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(pieceToChinese(piece, getPieceColor(piece)), currentX, currentY);
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                // 恢复原位置的棋子
                board[fromRow][fromCol] = originalPiece;
                // 执行实际的移动操作
                board[fromRow][fromCol] = EMPTY;
                board[toRow][toCol] = piece;
                callback();
            }
        }
        
        animate();
    }

    function executeMove(fromRow, fromCol, toRow, toCol) {
        const piece = board[fromRow][fromCol];
        const capturedPiece = board[toRow][toCol];
        const move = { fromRow, fromCol, toRow, toCol, piece };
        const notation = generateNotation(move, 'red');

        // 播放移动动画
        animateMove(fromRow, fromCol, toRow, toCol, piece, () => {
            playSfx(capturedPiece ? 'capture' : 'move');
            if (isInCheck(board, 'black')) {
                playSfx('check');
            }
            // 在棋盘更新后保存历史记录
            pushHistory(move, notation, capturedPiece);
            
            moveList.push(notation);
            refreshMoveList();

            selectedRow = -1;
            selectedCol = -1;
            currentHint = null;
            lastAiMove = null;
            drawBoard();

            if (isCheckmate(board, 'black')) {
                gameOver = true;
                gameStatusEl.innerText = '红方胜利！';
                // 保存胜利记录
                saveCurrentGame();
                const checkmateType = detectCheckmateType(board, 'black');
                setTimeout(() => showGameOverModal('red-win', '红方绝杀黑方，获得胜利！', checkmateType), 500);
                return;
            }

            currentPlayer = 'black';
            gameStatusEl.innerText = '黑方走棋';
            drawBoard();

            aiMakeMove();
        });
    }
    


    function handleCanvasClick(e) {
        if (isInOpeningAnimation) return;
        if (gameOver || currentPlayer !== 'red') return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const cell = getCellFromPoint(x, y);
        if (!cell) {
            selectedRow = -1;
            selectedCol = -1;
            drawBoard();
            return;
        }

        const { row, col } = cell;
        const piece = board[row][col];

        if (selectedRow === -1) {
            if (piece && getPieceColor(piece) === 'red') {
                selectedRow = row;
                selectedCol = col;
                drawBoard();
            }
        } else {
            const selectedPiece = board[selectedRow][selectedCol];
            
            if (row === selectedRow && col === selectedCol) {
                selectedRow = -1;
                selectedCol = -1;
                drawBoard();
                return;
            }
            
            if (piece && getPieceColor(piece) === 'red') {
                selectedRow = row;
                selectedCol = col;
                drawBoard();
                return;
            }
            
            if (!isValidAttack(board, selectedPiece, selectedRow, selectedCol, row, col)) {
                selectedRow = -1;
                selectedCol = -1;
                drawBoard();
                return;
            }

            if (moveWouldLeaveSelfInCheck(board, selectedRow, selectedCol, row, col, 'red')) {
                selectedRow = -1;
                selectedCol = -1;
                drawBoard();
                return;
            }

            executeMove(selectedRow, selectedCol, row, col);
        }
    }

    // 棋子基础价值

    // 获取棋子位置评分
    function getPosBonus(piece, row, col) {
        const p = piece.toLowerCase();
        let bonus = 0;
        if (p === 'p') {
            bonus = piece === 'P' ? pawnPosBonus[row][col] : pawnPosBonus[9-row][col];
        } else if (p === 'r') {
            bonus = piece === 'R' ? rookPosBonus[row][col] : rookPosBonus[9-row][col];
        } else if (p === 'n') {
            bonus = piece === 'N' ? knightPosBonus[row][col] : knightPosBonus[9-row][col];
        } else if (p === 'c') {
            bonus = piece === 'C' ? cannonPosBonus[row][col] : cannonPosBonus[9-row][col];
        } else if (p === 'a') {
            bonus = piece === 'A' ? advisorPosBonus[row][col] : advisorPosBonus[9-row][col];
        } else if (p === 'b') {
            bonus = piece === 'B' ? bishopPosBonus[row][col] : bishopPosBonus[9-row][col];
        }
        return bonus;
    }

    // 评估棋盘局面
    function evaluateBoard(b) {
        let score = 0;
        let redMaterial = 0, blackMaterial = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = b[r][c];
                if (!p) continue;
                
                let val = pieceValues[p] || 0;
                val += getPosBonus(p, r, c);
                
                // 机动性奖励
                const moves = getAllLegalMoves(b, getPieceColor(p));
                const pieceMoves = moves.filter(m => m.fromRow === r && m.fromCol === c).length;
                val += pieceMoves * 5;
                
                if (p === p.toLowerCase()) {
                    score -= val;
                    blackMaterial += pieceValues[p];
                } else {
                    score += val;
                    redMaterial += pieceValues[p];
                }
            }
        }
        
        // 将军惩罚/奖励
        if (isInCheck(b, 'red')) score -= 150;
        if (isInCheck(b, 'black')) score += 150;
        
        // 将死检测
        if (isCheckmate(b, 'red')) score -= 50000;
        if (isCheckmate(b, 'black')) score += 50000;
        
        // 增强评估因素
        score += evaluateProtection(b);
        score += evaluatePawns(b);
        score += evaluateRooks(b);
        score += evaluateKingSafety(b);
        score += evaluateCannons(b);
        score += evaluateKnights(b);
        score += evaluateElephants(b);
        score += evaluateAdvisors(b);
        score += evaluatePositionControl(b);
        score += evaluatePieceCoordination(b);
        
        return score;
    }

    // 评估马的位置和作用
    function evaluateKnights(board) {
        let score = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (!p || (p !== 'N' && p !== 'n')) continue;
                
                const color = getPieceColor(p);
                let knightScore = 0;
                
                // 马的机动性
                const moves = getLegalMovesForPiece(board, r, c, p);
                knightScore += moves.length * 10;
                
                // 马的位置价值
                if (color === 'red') {
                    // 红马的好位置
                    if ((r >= 3 && r <= 6) && (c >= 2 && c <= 6)) {
                        knightScore += 30;
                    }
                } else {
                    // 黑马的好位置
                    if ((r >= 3 && r <= 6) && (c >= 2 && c <= 6)) {
                        knightScore += 30;
                    }
                }
                
                // 马脚是否被绊
                const horseLegs = [
                    [r-1, c], [r+1, c], [r, c-1], [r, c+1]
                ];
                let blockedLegs = 0;
                for (let [hr, hc] of horseLegs) {
                    if (hr >= 0 && hr < ROWS && hc >= 0 && hc < COLS && board[hr][hc] !== EMPTY) {
                        blockedLegs++;
                    }
                }
                knightScore -= blockedLegs * 15;
                
                score += color === 'red' ? knightScore : -knightScore;
            }
        }
        
        return score;
    }

    // 评估象的位置和作用
    function evaluateElephants(board) {
        let score = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (!p || (p !== 'B' && p !== 'b')) continue;
                
                const color = getPieceColor(p);
                let elephantScore = 0;
                
                // 象的位置价值
                if (color === 'red') {
                    // 红象的好位置
                    const goodPositions = [[2, 2], [2, 6], [0, 4]];
                    for (let [gr, gc] of goodPositions) {
                        if (r === gr && c === gc) {
                            elephantScore += 20;
                            break;
                        }
                    }
                } else {
                    // 黑象的好位置
                    const goodPositions = [[7, 2], [7, 6], [9, 4]];
                    for (let [gr, gc] of goodPositions) {
                        if (r === gr && c === gc) {
                            elephantScore += 20;
                            break;
                        }
                    }
                }
                
                // 象的机动性
                const moves = getLegalMovesForPiece(board, r, c, p);
                elephantScore += moves.length * 5;
                
                score += color === 'red' ? elephantScore : -elephantScore;
            }
        }
        
        return score;
    }

    // 评估士的位置和作用
    function evaluateAdvisors(board) {
        let score = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (!p || (p !== 'A' && p !== 'a')) continue;
                
                const color = getPieceColor(p);
                let advisorScore = 0;
                
                // 士的位置价值
                if (color === 'red') {
                    // 红士的好位置
                    const goodPositions = [[0, 3], [0, 5], [1, 4]];
                    for (let [gr, gc] of goodPositions) {
                        if (r === gr && c === gc) {
                            advisorScore += 15;
                            break;
                        }
                    }
                } else {
                    // 黑士的好位置
                    const goodPositions = [[9, 3], [9, 5], [8, 4]];
                    for (let [gr, gc] of goodPositions) {
                        if (r === gr && c === gc) {
                            advisorScore += 15;
                            break;
                        }
                    }
                }
                
                // 士的保护作用
                if (color === 'red') {
                    // 保护红将
                    if (Math.abs(r - 0) <= 1 && Math.abs(c - 4) <= 1) {
                        advisorScore += 20;
                    }
                } else {
                    // 保护黑将
                    if (Math.abs(r - 9) <= 1 && Math.abs(c - 4) <= 1) {
                        advisorScore += 20;
                    }
                }
                
                score += color === 'red' ? advisorScore : -advisorScore;
            }
        }
        
        return score;
    }

    // 评估局面控制度
    function evaluatePositionControl(board) {
        let score = 0;
        let redControl = 0;
        let blackControl = 0;
        
        // 评估每个格子的控制情况
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // 计算红方对该格子的控制
                if (isSquareAttacked(board, r, c, 'red')) {
                    redControl++;
                }
                // 计算黑方对该格子的控制
                if (isSquareAttacked(board, r, c, 'black')) {
                    blackControl++;
                }
            }
        }
        
        // 中心控制奖励
        const centerSquares = [[4, 4], [4, 3], [4, 5], [5, 4], [5, 3], [5, 5]];
        for (let [r, c] of centerSquares) {
            if (isSquareAttacked(board, r, c, 'red')) {
                redControl += 2;
            }
            if (isSquareAttacked(board, r, c, 'black')) {
                blackControl += 2;
            }
        }
        
        score = (redControl - blackControl) * 2;
        return score;
    }

    // 评估棋子协调性
    function evaluatePieceCoordination(board) {
        let score = 0;
        
        // 评估车的协调性
        let redRooks = [];
        let blackRooks = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p === 'R') redRooks.push({r, c});
                if (p === 'r') blackRooks.push({r, c});
            }
        }
        
        // 双车协调
        if (redRooks.length === 2) {
            const [r1, r2] = redRooks;
            if (r1.r === r2.r) {
                score += 20; // 同一条线的双车
            }
        }
        if (blackRooks.length === 2) {
            const [r1, r2] = blackRooks;
            if (r1.r === r2.r) {
                score -= 20; // 同一条线的双车
            }
        }
        
        // 评估马炮协调
        let redKnights = [];
        let redCannons = [];
        let blackKnights = [];
        let blackCannons = [];
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p === 'N') redKnights.push({r, c});
                if (p === 'C') redCannons.push({r, c});
                if (p === 'n') blackKnights.push({r, c});
                if (p === 'c') blackCannons.push({r, c});
            }
        }
        
        // 马炮配合
        for (let knight of redKnights) {
            for (let cannon of redCannons) {
                if (Math.abs(knight.r - cannon.r) <= 2 && Math.abs(knight.c - cannon.c) <= 2) {
                    score += 10; // 马炮配合
                }
            }
        }
        for (let knight of blackKnights) {
            for (let cannon of blackCannons) {
                if (Math.abs(knight.r - cannon.r) <= 2 && Math.abs(knight.c - cannon.c) <= 2) {
                    score -= 10; // 马炮配合
                }
            }
        }
        
        return score;
    }

    // 检查棋子是否被保护
    function isProtected(board, row, col, color) {
        const piece = board[row][col];
        if (!piece) return false;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (!p || getPieceColor(p) !== color) continue;
                
                const moves = getLegalMovesForPiece(board, r, c, p);
                for (let move of moves) {
                    if (move.toRow === row && move.toCol === col) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    // 评估棋子的保护情况
    function evaluateProtection(board) {
        let score = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (!p) continue;
                
                const color = getPieceColor(p);
                const isProtectedFlag = isProtected(board, r, c, color);
                const pieceValue = pieceValues[p] || 0;
                
                if (isProtectedFlag) {
                    score += color === 'red' ? pieceValue * 0.1 : -pieceValue * 0.1;
                } else {
                    score -= color === 'red' ? pieceValue * 0.15 : -pieceValue * 0.15;
                }
            }
        }
        
        return score;
    }

    // 评估兵的推进和联合作战
    function evaluatePawns(board) {
        let score = 0;
        let redPawns = [];
        let blackPawns = [];
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p === 'P') redPawns.push({r, c});
                if (p === 'p') blackPawns.push({r, c});
            }
        }
        
        // 评估红兵
        for (let i = 0; i < redPawns.length; i++) {
            const pawn = redPawns[i];
            // 兵的推进奖励
            score += (9 - pawn.r) * 10;
            // 兵的联合作战
            for (let j = i + 1; j < redPawns.length; j++) {
                const otherPawn = redPawns[j];
                if (Math.abs(pawn.c - otherPawn.c) <= 1 && Math.abs(pawn.r - otherPawn.r) <= 2) {
                    score += 15;
                }
            }
        }
        
        // 评估黑兵
        for (let i = 0; i < blackPawns.length; i++) {
            const pawn = blackPawns[i];
            // 兵的推进奖励
            score -= pawn.r * 10;
            // 兵的联合作战
            for (let j = i + 1; j < blackPawns.length; j++) {
                const otherPawn = blackPawns[j];
                if (Math.abs(pawn.c - otherPawn.c) <= 1 && Math.abs(pawn.r - otherPawn.r) <= 2) {
                    score -= 15;
                }
            }
        }
        
        return score;
    }

    // 评估车的通路性
    function evaluateRooks(board) {
        let score = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p !== 'R' && p !== 'r') continue;
                
                const color = getPieceColor(p);
                let fileClear = true;
                let rankClear = true;
                
                // 检查列是否畅通
                for (let i = r - 1; i >= 0; i--) {
                    if (board[i][c]) {
                        fileClear = false;
                        break;
                    }
                }
                
                // 检查行是否畅通
                for (let i = c - 1; i >= 0; i--) {
                    if (board[r][i]) {
                        rankClear = false;
                        break;
                    }
                }
                
                if (fileClear || rankClear) {
                    score += color === 'red' ? 50 : -50;
                }
            }
        }
        
        return score;
    }

    // 评估王的安全性
    function evaluateKingSafety(board) {
        let score = 0;
        
        // 找到红王和黑王
        let redKing = null;
        let blackKing = null;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p === 'K') redKing = {r, c};
                if (p === 'k') blackKing = {r, c};
            }
        }
        
        if (redKing) {
            // 红王的安全性
            const redKingMoves = getLegalMovesForPiece(board, redKing.r, redKing.c, 'K');
            score += redKingMoves.length * 5;
            
            // 检查红王是否被攻击
            if (isInCheck(board, 'red')) {
                score -= 200;
            }
        }
        
        if (blackKing) {
            // 黑王的安全性
            const blackKingMoves = getLegalMovesForPiece(board, blackKing.r, blackKing.c, 'k');
            score -= blackKingMoves.length * 5;
            
            // 检查黑王是否被攻击
            if (isInCheck(board, 'black')) {
                score += 200;
            }
        }
        
        return score;
    }

    // 评估炮的架炮能力
    function evaluateCannons(board) {
        let score = 0;
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p !== 'C' && p !== 'c') continue;
                
                const color = getPieceColor(p);
                let hasPlatform = false;
                
                // 检查横向架炮
                for (let i = c - 1; i >= 0; i--) {
                    if (board[r][i]) {
                        hasPlatform = true;
                        break;
                    }
                }
                
                if (!hasPlatform) {
                    for (let i = c + 1; i < COLS; i++) {
                        if (board[r][i]) {
                            hasPlatform = true;
                            break;
                        }
                    }
                }
                
                // 检查纵向架炮
                if (!hasPlatform) {
                    for (let i = r - 1; i >= 0; i--) {
                        if (board[i][c]) {
                            hasPlatform = true;
                            break;
                        }
                    }
                }
                
                if (!hasPlatform) {
                    for (let i = r + 1; i < ROWS; i++) {
                        if (board[i][c]) {
                            hasPlatform = true;
                            break;
                        }
                    }
                }
                
                if (hasPlatform) {
                    score += color === 'red' ? 30 : -30;
                }
            }
        }
        
        return score;
    }

    // 历史启发表 - 记录表现好的走法
    const historyTable = new Array(10).fill(null).map(() => new Array(9).fill(0));

    // 开局库 - 常见的中国象棋开局走法
    const openingBook = [
        // 当头炮对屏风马
        ['炮二平五', '马8进7', '马二进三', '车9平8', '车一平二', '马2进3', '兵七进一', '卒7进1', '马八进七', '象3进5'],
        // 当头炮对反宫马
        ['炮二平五', '马2进3', '马二进三', '炮8平6', '车一平二', '马8进7', '炮八平六', '车1平2', '马八进七', '炮2进4'],
        // 飞相局
        ['相三进五', '炮8平5', '马二进三', '马8进7', '车一平二', '车9平8', '马八进七', '马2进3', '兵七进一', '卒7进1'],
        // 士角炮
        ['炮二平四', '马8进7', '马二进三', '车9平8', '车一平二', '炮8进4', '兵三进一', '炮2平5', '马八进七', '马2进3'],
        // 仙人指路
        ['兵七进一', '卒7进1', '马八进七', '马8进7', '炮二平五', '马2进3', '马二进三', '车9平8', '车一平二', '炮8进4']
    ];

    // 检查是否在开局库中
    function checkOpeningBook(moveHistory) {
        if (moveHistory.length < 2 || moveHistory.length > 18) return null;
        
        for (let opening of openingBook) {
            let match = true;
            for (let i = 0; i < moveHistory.length; i++) {
                if (moveHistory[i] !== opening[i]) {
                    match = false;
                    break;
                }
            }
            if (match && moveHistory.length < opening.length) {
                return opening[moveHistory.length];
            }
        }
        return null;
    }

    // 从棋子记谱转换为坐标
    function notationToMove(notation, board, color) {
        // 解析走子记录格式：例如 "红炮2进3" 或 "黑车1平2"
        // 格式：颜色 + 棋子 + 起始位置 + 方向 + 步数
        const match = notation.match(/(红|黑)([车马炮象士将士象車馬炮卒兵])([一二三四五六七八九1-9])([进退平])([一二三四五六七八九1-9])/);
        if (!match) return null;
        
        const [, moveColor, piece, startPos, direction, step] = match;
        
        // 确保颜色匹配
        if ((moveColor === '红' && color !== 'red') || (moveColor === '黑' && color !== 'black')) {
            return null;
        }
        
        // 转换棋子类型
        const pieceMap = {
            '车': 'R', '马': 'N', '炮': 'C', '象': 'B', '士': 'A', '将': 'K', '兵': 'P',
            '車': 'r', '馬': 'n', '炮': 'c', '象': 'b', '士': 'a', '士': 'k', '卒': 'p'
        };
        
        const pieceType = pieceMap[piece] || null;
        if (!pieceType) return null;
        
        // 找到起始位置
        let fromRow, fromCol;
        const startNum = parseInt(startPos) - 1;
        
        if (color === 'red') {
            // 红方视角：列从右到左1-9
            fromCol = 8 - startNum;
            // 查找该列上的指定棋子
            for (let row = 0; row < 10; row++) {
                if (board[row][fromCol] === pieceType) {
                    fromRow = row;
                    break;
                }
            }
        } else {
            // 黑方视角：列从右到左1-9
            fromCol = 8 - startNum;
            // 查找该列上的指定棋子
            for (let row = 9; row >= 0; row--) {
                if (board[row][fromCol] === pieceType) {
                    fromRow = row;
                    break;
                }
            }
        }
        
        if (fromRow === undefined) return null;
        
        // 计算目标位置
        let toRow, toCol;
        const stepNum = parseInt(step);
        
        switch (direction) {
            case '进':
                toRow = color === 'red' ? fromRow + stepNum : fromRow - stepNum;
                toCol = fromCol;
                break;
            case '退':
                toRow = color === 'red' ? fromRow - stepNum : fromRow + stepNum;
                toCol = fromCol;
                break;
            case '平':
                toRow = fromRow;
                toCol = 8 - (parseInt(step) - 1);
                break;
            default:
                return null;
        }
        
        // 验证目标位置是否合法
        if (toRow < 0 || toRow >= 10 || toCol < 0 || toCol >= 9) {
            return null;
        }
        
        return {
            fromRow,
            fromCol,
            toRow,
            toCol,
            piece: pieceType
        };
    }

    // 迭代加深搜索
    function minimax(b, depth, alpha, beta, isMaximizing, maxDepth, debugInfo) {
        // 静态评估 - 到达叶子节点
        if (depth === 0) {
            return quiescenceSearch(b, alpha, beta, isMaximizing, 8);
        }
        
        const color = isMaximizing ? 'red' : 'black';
        const moves = getAllLegalMoves(b, color);
        
        if (moves.length === 0) {
            return isMaximizing ? -100000 - depth : 100000 + depth;
        }
        
        // 高级移动排序 - 提高剪枝效率
        moves.sort((moveA, moveB) => {
            let scoreA = 0, scoreB = 0;
            
            // 1. 将军优先
            const boardA = copyBoard(b);
            boardA[moveA.fromRow][moveA.fromCol] = EMPTY;
            boardA[moveA.toRow][moveA.toCol] = moveA.piece;
            const boardB = copyBoard(b);
            boardB[moveB.fromRow][moveB.fromCol] = EMPTY;
            boardB[moveB.toRow][moveB.toCol] = moveB.piece;
            
            const isCheckA = isInCheck(boardA, color === 'red' ? 'black' : 'red');
            const isCheckB = isInCheck(boardB, color === 'red' ? 'black' : 'red');
            if (isCheckA) scoreA += 1000;
            if (isCheckB) scoreB += 1000;
            
            // 2. 吃子价值
            const captureValueA = pieceValues[b[moveA.toRow][moveA.toCol]] || 0;
            const captureValueB = pieceValues[b[moveB.toRow][moveB.toCol]] || 0;
            scoreA += captureValueA * 100;
            scoreB += captureValueB * 100;
            
            // 3. 子力交换评估（考虑自身损失）
            const pieceValueA = pieceValues[moveA.piece] || 0;
            const pieceValueB = pieceValues[moveB.piece] || 0;
            scoreA += (captureValueA - pieceValueA) * 50;
            scoreB += (captureValueB - pieceValueB) * 50;
            
            // 4. 机动性（移动后可移动的位置数）
            const mobilityA = getLegalMovesForPiece(boardA, moveA.toRow, moveA.toCol, moveA.piece).length;
            const mobilityB = getLegalMovesForPiece(boardB, moveB.toRow, moveB.toCol, moveB.piece).length;
            scoreA += mobilityA * 10;
            scoreB += mobilityB * 10;
            
            // 5. 中心控制
            const centerA = Math.abs(moveA.toRow - 4.5) + Math.abs(moveA.toCol - 4);
            const centerB = Math.abs(moveB.toRow - 4.5) + Math.abs(moveB.toCol - 4);
            scoreA += (10 - centerA) * 5;
            scoreB += (10 - centerB) * 5;
            
            // 6. 历史启发
            scoreA += historyTable[moveA.fromRow][moveA.fromCol] * 0.1;
            scoreB += historyTable[moveB.fromRow][moveB.fromCol] * 0.1;
            
            return scoreB - scoreA;
        });
        
        if (isMaximizing) {
            let maxEval = -Infinity;
            let bestMove = null;
            for (let i = 0; i < moves.length; i++) {
                const move = moves[i];
                
                // 发送调试信息
                if (debugInfo && depth === maxDepth) {
                    self.postMessage({
                        type: 'debug',
                        move: move,
                        depth: depth,
                        moveIndex: i,
                        totalMoves: moves.length
                    });
                }
                
                const newB = copyBoard(b);
                newB[move.fromRow][move.fromCol] = EMPTY;
                newB[move.toRow][move.toCol] = move.piece;
                const evalScore = minimax(newB, depth - 1, alpha, beta, false, maxDepth, debugInfo);
                
                if (evalScore > maxEval) {
                    maxEval = evalScore;
                    bestMove = move;
                }
                
                alpha = Math.max(alpha, evalScore);
                
                // 更新历史启发表
                if (evalScore > alpha) {
                    historyTable[move.fromRow][move.fromCol] += depth * depth;
                }
                
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let i = 0; i < moves.length; i++) {
                const move = moves[i];
                
                // 发送调试信息
                if (debugInfo && depth === maxDepth) {
                    self.postMessage({
                        type: 'debug',
                        move: move,
                        depth: depth,
                        moveIndex: i,
                        totalMoves: moves.length
                    });
                }
                
                const newB = copyBoard(b);
                newB[move.fromRow][move.fromCol] = EMPTY;
                newB[move.toRow][move.toCol] = move.piece;
                const evalScore = minimax(newB, depth - 1, alpha, beta, true, maxDepth, debugInfo);
                minEval = Math.min(minEval, evalScore);
                beta = Math.min(beta, evalScore);
                
                // 更新历史启发表
                if (evalScore < beta) {
                    historyTable[move.fromRow][move.fromCol] += depth * depth;
                }
                
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }

    // 静态搜索 - 解决水平线问题
    function quiescenceSearch(b, alpha, beta, isMaximizing, depth) {
        const standPat = evaluateBoard(b);
        
        if (isMaximizing) {
            if (standPat >= beta) return beta;
            if (alpha < standPat) alpha = standPat;
        } else {
            if (standPat <= alpha) return alpha;
            if (beta > standPat) beta = standPat;
        }
        
        if (depth === 0) return standPat;
        
        const color = isMaximizing ? 'red' : 'black';
        const moves = getAllLegalMoves(b, color);
        
        // 只考虑吃子着法
        const captureMoves = moves.filter(m => b[m.toRow][m.toCol] !== EMPTY);
        
        if (isMaximizing) {
            for (let move of captureMoves) {
                const capturedValue = pieceValues[b[move.toRow][move.toCol]] || 0;
                // Delta剪枝
                if (standPat + capturedValue + 200 < alpha) continue;
                
                const newB = copyBoard(b);
                newB[move.fromRow][move.fromCol] = EMPTY;
                newB[move.toRow][move.toCol] = move.piece;
                const score = quiescenceSearch(newB, alpha, beta, false, depth - 1);
                if (score >= beta) return beta;
                if (score > alpha) alpha = score;
            }
            return alpha;
        } else {
            for (let move of captureMoves) {
                const capturedValue = pieceValues[b[move.toRow][move.toCol]] || 0;
                if (standPat - capturedValue - 200 > beta) continue;
                
                const newB = copyBoard(b);
                newB[move.fromRow][move.fromCol] = EMPTY;
                newB[move.toRow][move.toCol] = move.piece;
                const score = quiescenceSearch(newB, alpha, beta, true, depth - 1);
                if (score <= alpha) return alpha;
                if (score < beta) beta = score;
            }
            return beta;
        }
    }

    // 从开局库中获取走法
    function checkOpeningBook(moveHistory) {
        const openingBook = [
            // 当头炮对屏风马
            ['炮二平五', '马8进7', '马二进三', '车9平8', '车一平二', '马2进3', '兵七进一', '卒7进1', '马八进七', '象3进5'],
            // 当头炮对反宫马
            ['炮二平五', '马2进3', '马二进三', '炮8平6', '车一平二', '马8进7', '炮八平六', '车1平2', '马八进七', '炮2进4'],
            // 飞相局
            ['相三进五', '炮8平5', '马二进三', '马8进7', '车一平二', '车9平8', '马八进七', '马2进3', '兵七进一', '卒7进1'],
            // 士角炮
            ['炮二平四', '马8进7', '马二进三', '车9平8', '车一平二', '炮8进4', '兵三进一', '炮2平5', '马八进七', '马2进3'],
            // 仙人指路
            ['兵七进一', '卒7进1', '马八进七', '马8进7', '炮二平五', '马2进3', '马二进三', '车9平8', '车一平二', '炮8进4']
        ];
        
        if (moveHistory.length < 2 || moveHistory.length > 18) return null;
        
        for (let opening of openingBook) {
            let match = true;
            for (let i = 0; i < moveHistory.length; i++) {
                if (moveHistory[i] !== opening[i]) {
                    match = false;
                    break;
                }
            }
            if (match && moveHistory.length < opening.length) {
                return opening[moveHistory.length];
            }
        }
        return null;
    }

    // 从棋子记谱转换为坐标
    function notationToMove(notation, board, color) {
        const moves = getAllLegalMoves(board, color);
        for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            const n = generateNotation(m, color);
            if (n === notation) return m;
        }
        return null;
    }

    // 获取棋子名称
    function getPieceName(piece) {
        const pieceNames = {
            'R': '车', 'N': '马', 'B': '象', 'A': '士', 'K': '将', 'C': '炮', 'P': '兵',
            'r': '车', 'n': '马', 'b': '象', 'a': '士', 'k': '将', 'c': '炮', 'p': '卒'
        };
        return pieceNames[piece] || piece;
    }
    
    // 绘制调试信息
    function drawDebugInfo(move) {
        ctx.save();
        
        // 绘制源位置
        ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
        ctx.fillRect(move.fromCol * cellSize + padding, move.fromRow * cellSize + padding, cellSize, cellSize);
        
        // 绘制目标位置
        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(move.toCol * cellSize + padding, move.toRow * cellSize + padding, cellSize, cellSize);
        
        // 绘制箭头
        ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(move.fromCol * cellSize + padding + cellSize / 2, move.fromRow * cellSize + padding + cellSize / 2);
        ctx.lineTo(move.toCol * cellSize + padding + cellSize / 2, move.toRow * cellSize + padding + cellSize / 2);
        ctx.stroke();
        
        ctx.restore();
    }

    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#5d3e1f';
        
        for (let i = 0; i < ROWS; i++) {
            ctx.beginPath();
            const y = padding + i * cellSize;
            ctx.moveTo(padding, y);
            ctx.lineTo(padding + (COLS - 1) * cellSize, y);
            ctx.stroke();
        }
        
        for (let i = 0; i < COLS; i++) {
            const x = padding + i * cellSize;
            ctx.beginPath();
            ctx.moveTo(x, padding);
            ctx.lineTo(x, padding + 4 * cellSize);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, padding + 5 * cellSize);
            ctx.lineTo(x, padding + 9 * cellSize);
            ctx.stroke();
        }

        ctx.font = 'bold 28px "KaiTi", serif';
        ctx.fillStyle = '#3d280e';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('楚  河', padding + 2 * cellSize, padding + 4.5 * cellSize);
        ctx.fillText('漢  界', padding + 6 * cellSize, padding + 4.5 * cellSize);
        
        // 绘制定位文字
        ctx.font = '14px "Arial", sans-serif';
        ctx.fillStyle = '#8b4513';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // 上方列标 (红方)
        const redCols = ['九', '八', '七', '六', '五', '四', '三', '二', '一'];
        for (let c = 0; c < COLS; c++) {
            ctx.fillText(redCols[c], padding + c * cellSize, padding - 20);
        }
        
        // 左侧行标 (红方)
        const redRows = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        for (let r = 0; r < ROWS; r++) {
            ctx.fillText(redRows[r], padding - 20, padding + r * cellSize);
        }
        
        ctx.beginPath();
        ctx.moveTo(padding + 3 * cellSize, padding);
        ctx.lineTo(padding + 5 * cellSize, padding + 2 * cellSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padding + 5 * cellSize, padding);
        ctx.lineTo(padding + 3 * cellSize, padding + 2 * cellSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padding + 3 * cellSize, padding + 9 * cellSize);
        ctx.lineTo(padding + 5 * cellSize, padding + 7 * cellSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padding + 5 * cellSize, padding + 9 * cellSize);
        ctx.lineTo(padding + 3 * cellSize, padding + 7 * cellSize);
        ctx.stroke();

        if (selectedRow !== -1 && selectedCol !== -1) {
            const selectedPiece = board[selectedRow][selectedCol];
            const legalMoves = getAllLegalMoves(board, 'red').filter(m => 
                m.fromRow === selectedRow && m.fromCol === selectedCol
            );

            // 如果是炮，显示可吃子路径（隔子吃子）
            if (selectedPiece && selectedPiece.toLowerCase() === 'c') {
                // 四个方向检查
                const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                for (let [dr, dc] of directions) {
                    let r = selectedRow + dr;
                    let c = selectedCol + dc;
                    let foundPlatform = false;
                    
                    // 沿方向移动，寻找炮架
                    while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                        if (!foundPlatform) {
                            // 还没找到炮架，找第一个棋子作为炮架
                            if (board[r][c] !== EMPTY) {
                                foundPlatform = true;
                            }
                        } else {
                            // 已经找到炮架，找可以吃的棋子
                            if (board[r][c] !== EMPTY) {
                                const targetPiece = board[r][c];
                                // 只能吃对方的棋子
                                if (getPieceColor(targetPiece) !== getPieceColor(selectedPiece)) {
                                    const pt = getPointFromCell(r, c);
                                    // 绘制可吃子标记
                                    ctx.save();
                                    ctx.beginPath();
                                    ctx.fillStyle = 'rgba(255, 90, 90, 0.65)';
                                    ctx.arc(pt.x, pt.y, cellSize * 0.32, 0, 2 * Math.PI);
                                    ctx.shadowColor = 'rgba(255, 0, 0, 0.45)';
                                    ctx.shadowBlur = 12;
                                    ctx.fill();
                                    ctx.shadowBlur = 0;
                                    ctx.strokeStyle = 'rgba(180, 0, 0, 0.95)';
                                    ctx.lineWidth = 4;
                                    ctx.stroke();
                                    
                                    // 显示被吃的棋子
                                    const capturedPieceChar = pieceToChinese(targetPiece, 'red');
                                    ctx.fillStyle = 'rgba(170, 0, 0, 0.95)';
                                    ctx.font = 'bold 14px "Arial", sans-serif';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillText(capturedPieceChar, pt.x, pt.y);
                                    
                                    // 目标红色高亮
                                    ctx.beginPath();
                                    ctx.arc(pt.x, pt.y, cellSize * 0.42, 0, 2 * Math.PI);
                                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.75)';
                                    ctx.lineWidth = 3;
                                    ctx.stroke();
                                    ctx.restore();
                                    
                                    // 绘制从炮架到目标的虚线路径
                                    // 找到炮架位置
                                    let pr = selectedRow + dr;
                                    let pc = selectedCol + dc;
                                    while (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS && board[pr][pc] === EMPTY) {
                                        pr += dr;
                                        pc += dc;
                                    }
                                    if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS && board[pr][pc] !== EMPTY) {
                                        const platformPt = getPointFromCell(pr, pc);
                                        ctx.save();
                                        ctx.beginPath();
                                        ctx.moveTo(platformPt.x, platformPt.y);
                                        ctx.lineTo(pt.x, pt.y);
                                        ctx.strokeStyle = 'rgba(255, 70, 70, 0.9)';
                                        ctx.lineWidth = 4;
                                        ctx.setLineDash([8, 6]);
                                        ctx.stroke();
                                        ctx.setLineDash([]);
                                        ctx.restore();
                                    }
                                }
                                break; // 找到第一个可吃子就停止
                            }
                        }
                        r += dr;
                        c += dc;
                    }
                }
            }

            for (let move of legalMoves) {
                const pt = getPointFromCell(move.toRow, move.toCol);
                const targetPiece = board[move.toRow][move.toCol];
                const isCapture = targetPiece !== EMPTY;
                let isDangerous = isSquareAttacked(board, move.toRow, move.toCol, 'black');
                let isProtected = isSquareProtected(board, move.toRow, move.toCol, 'red');
                
                ctx.beginPath();
                if (isCapture) {
                    // 可吃子显示为黄色
                    ctx.fillStyle = 'rgba(255, 200, 0, 0.5)';
                    ctx.arc(pt.x, pt.y, cellSize * 0.25, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    // 显示被吃的棋子
                    const capturedPieceChar = pieceToChinese(targetPiece, 'red');
                    ctx.fillStyle = 'rgba(255, 200, 0, 0.8)';
                    ctx.font = 'bold 14px "Arial", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(capturedPieceChar, pt.x, pt.y);
                } else if (isDangerous && !isProtected) {
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
                    ctx.arc(pt.x, pt.y, cellSize * 0.25, 0, 2 * Math.PI);
                    ctx.fill();
                } else if (isDangerous && isProtected) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.55)';
                    ctx.arc(pt.x, pt.y, cellSize * 0.25, 0, 2 * Math.PI);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(50, 200, 50, 0.5)';
                    ctx.arc(pt.x, pt.y, cellSize * 0.25, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
        }

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const piece = board[r][c];
                if (!piece) continue;
                const pt = getPointFromCell(r, c);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, cellSize * 0.4, 0, 2 * Math.PI);
                ctx.fillStyle = (getPieceColor(piece) === 'red') ? '#cf4a4a' : '#2f4f4f';
                ctx.fill();
                ctx.strokeStyle = '#f5e6c4';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.font = 'bold 30px "KaiTi", serif';
                ctx.fillStyle = '#fbf3d5';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pieceToChinese(piece, getPieceColor(piece)), pt.x, pt.y);
            }
        }
        
        // 显示电脑落子路径
        if (lastAiMove) {
            const fromPt = getPointFromCell(lastAiMove.fromRow, lastAiMove.fromCol);
            const toPt = getPointFromCell(lastAiMove.toRow, lastAiMove.toCol);
            ctx.beginPath();
            ctx.moveTo(fromPt.x, fromPt.y);
            ctx.lineTo(toPt.x, toPt.y);
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 起点标记
            ctx.beginPath();
            ctx.arc(fromPt.x, fromPt.y, cellSize * 0.2, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 107, 53, 0.7)';
            ctx.fill();
            
            // 终点标记
            ctx.beginPath();
            ctx.arc(toPt.x, toPt.y, cellSize * 0.3, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 显示提示
        if (currentHint) {
            const fromPt = getPointFromCell(currentHint.fromRow, currentHint.fromCol);
            const toPt = getPointFromCell(currentHint.toRow, currentHint.toCol);
            
            // 起点标记
            ctx.beginPath();
            ctx.arc(fromPt.x, fromPt.y, cellSize * 0.3, 0, 2 * Math.PI);
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 终点标记
            ctx.beginPath();
            ctx.arc(toPt.x, toPt.y, cellSize * 0.4, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(76, 175, 80, 0.3)';
            ctx.fill();
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 连接线
            ctx.beginPath();
            ctx.moveTo(fromPt.x, fromPt.y);
            ctx.lineTo(toPt.x, toPt.y);
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (selectedRow !== -1 && selectedCol !== -1) {
            const pt = getPointFromCell(selectedRow, selectedCol);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, cellSize * 0.45, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ffd966';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        // 显示将军威胁
        if (currentPlayer === 'red' && isInCheck(board, 'red')) {
            const threats = getCheckThreats(board, 'red');
            const time = Date.now() / 500;
            const opacity = 0.5 + 0.5 * Math.sin(time);
            
            for (let threat of threats) {
                const fromPt = getPointFromCell(threat.fromRow, threat.fromCol);
                const toPt = getPointFromCell(threat.toRow, threat.toCol);
                
                // 进攻路径
                ctx.beginPath();
                ctx.moveTo(fromPt.x, fromPt.y);
                ctx.lineTo(toPt.x, toPt.y);
                ctx.strokeStyle = `rgba(255, 0, 0, ${opacity})`;
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // 威胁棋子标记
                ctx.beginPath();
                ctx.arc(fromPt.x, fromPt.y, cellSize * 0.35, 0, 2 * Math.PI);
                ctx.strokeStyle = `rgba(255, 0, 0, ${opacity})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }
    }

    canvas.addEventListener('click', handleCanvasClick);

    // 和局函数
    function drawGame() {
        if (moveList.length === 0) {
            showModal('提示', '还没有开始对局，无法和局！');
            return;
        }
        
        showModal('确认', '确定要和局吗？', true, () => {
            gameOver = true;
            
            // 保存和局记录
            // 确保window.gameRecords存在
            if (!window.gameRecords) {
                window.gameRecords = {
                    recent: [],
                    favorites: []
                };
            }
            
            const now = new Date();
            const record = {
                id: Date.now(),
                date: now.toLocaleString('zh-CN'),
                time: {
                    year: now.getFullYear(),
                    month: now.getMonth() + 1,
                    day: now.getDate(),
                    hour: now.getHours(),
                    minute: now.getMinutes()
                },
                moves: [...moveList],
                fen: boardToFen(),
                result: '和局'
            };
            
            window.gameRecords.recent.unshift(record);
            if (window.gameRecords.recent.length > 5) {
                window.gameRecords.recent.pop();
            }
            
            saveGameRecords();
            
            // 显示和局提示
            gameStatusEl.innerText = '和局';
            setTimeout(() => showGameOverModal('draw', '双方达成和局，平分秋色！', '将死'), 300);
        });
    }





    // 游戏控制按钮事件监听器
    const hintBtn = document.getElementById('hintBtn');
    const regretBtn = document.getElementById('regretBtn');
    const drawBtn = document.getElementById('drawBtn');
    const restartBtn = document.getElementById('restartBtn');
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    const saveFenBtn = document.getElementById('saveFenBtn');
    const loadFenBtn = document.getElementById('loadFenBtn');

    regretBtn.addEventListener('click', () => {
        playSfx('click');
        regretMove();
    });

    drawBtn.addEventListener('click', () => {
        playSfx('click');
        drawGame();
    });

    restartBtn.addEventListener('click', () => {
        playSfx('click');
        showModal('确认', '确定要开始新的一局吗？当前对局进度将丢失。', true, () => {
            showDifficultyModal();
        });
    });

    backToMenuBtn.addEventListener('click', () => {
        playSfx('click');
        showModal('确认', '确定要返回主菜单吗？是否退出当前对局？', true, () => {
            // 保存放弃对局记录
            saveCurrentGame();
            showMainMenu();
        });
    });

    // 游戏内难度选择变化监听器
    const gameDifficultySelect = document.getElementById('gameDifficultySelect');
    if (gameDifficultySelect) {
        gameDifficultySelect.addEventListener('change', () => {
            gameSettings.difficulty = parseInt(gameDifficultySelect.value);
            localStorage.setItem('chessSettings', JSON.stringify(gameSettings));
            updateAiDifficultyDisplay();
        });
    }

    hintBtn.addEventListener('click', () => {
        playSfx('click');
        if (gameOver || currentPlayer !== 'red') return;
        
        // 显示提示中状态
        gameStatusEl.innerText = '正在计算提示...';
        
        // 创建临时Worker来计算最佳走法
        const hintWorker = new Worker(workerUrl);
        hintWorker.onmessage = function(e) {
            const { move } = e.data;
            if (move) {
                currentHint = move;
                gameStatusEl.innerText = '提示已显示';
                drawBoard();
            } else {
                gameStatusEl.innerText = '无可用提示';
            }
            hintWorker.terminate();
        };
        
        hintWorker.postMessage({
            board: board,
            difficulty: currentGameDifficulty,
            moveList: moveList,
            computeMode: computeMode,
            isHint: true
        });
    });

    function boardToFen() {
        let fen = '';
        for (let r = 0; r < ROWS; r++) {
            let emptyCount = 0;
            for (let c = 0; c < COLS; c++) {
                const piece = board[r][c];
                if (piece === EMPTY) {
                    emptyCount++;
                } else {
                    if (emptyCount > 0) {
                        fen += emptyCount;
                        emptyCount = 0;
                    }
                    fen += piece;
                }
            }
            if (emptyCount > 0) {
                fen += emptyCount;
            }
            if (r < ROWS - 1) {
                fen += '/';
            }
        }
        fen += ' ' + (currentPlayer === 'red' ? 'w' : 'b');
        return fen;
    }

    function fenToBoard(fen) {
        const parts = fen.split(' ');
        if (parts.length < 2) return false;
        
        const boardPart = parts[0];
        const rows = boardPart.split('/');
        
        if (rows.length !== ROWS) return false;
        
        const newBoard = [];
        for (let r = 0; r < ROWS; r++) {
            const rowStr = rows[r];
            const newRow = [];
            let col = 0;
            for (let i = 0; i < rowStr.length && col < COLS; i++) {
                const char = rowStr[i];
                if (char >= '0' && char <= '9') {
                    const count = parseInt(char);
                    for (let j = 0; j < count && col < COLS; j++) {
                        newRow.push(EMPTY);
                        col++;
                    }
                } else {
                    newRow.push(char);
                    col++;
                }
            }
            while (col < COLS) {
                newRow.push(EMPTY);
                col++;
            }
            newBoard.push(newRow);
        }
        
        return {
            board: newBoard,
            currentPlayer: parts[1] === 'w' ? 'red' : 'black'
        };
    }

    saveFenBtn.addEventListener('click', () => {
        playSfx('click');
        const fen = boardToFen();
        navigator.clipboard.writeText(fen).then(() => {
            showModal('提示', 'FEN已复制到剪贴板！\n\n' + fen);
        }).catch(() => {
            prompt('请复制以下FEN字符串：', fen);
        });
    });

    loadFenBtn.addEventListener('click', () => {
        playSfx('click');
        const fen = prompt('请输入FEN字符串：');
        if (!fen) return;
        
        const result = fenToBoard(fen);
        if (!result) {
            showModal('错误', '无效的FEN格式！');
            return;
        }
        
        board = result.board;
        currentPlayer = result.currentPlayer;
        gameOver = false;
        history = [];
        moveList = [];
        selectedRow = -1;
        selectedCol = -1;
        refreshMoveList();
        gameStatusEl.innerText = (currentPlayer === 'red' ? '红' : '黑') + '方走棋';
        drawBoard();
        
        if (currentPlayer === 'black') {
            aiMakeMove();
        }
    });

    // 重启游戏函数
    function restartGame() {
        if (aiWorker) {
            aiWorker.terminate();
            aiWorker = null;
        }
        board = getInitBoard();
        currentPlayer = 'red';
        gameOver = false;
        history = [];
        moveList = [];
        selectedRow = -1; selectedCol = -1;
        currentHint = null;
        lastAiMove = null;
        movePatterns = [];
        resetRegretLimitForNewGame();
        
        // 应用设置
        computeMode = gameSettings.computeMode || 'gpu';
        
        // 更新AI难度显示
        updateAiDifficultyDisplay();
        
        // 启用游戏控制按钮
        enableGameControls();
        updateRegretButtonText();
        
        drawBoard();
        gameStatusEl.innerText = '红方走棋';
        refreshMoveList();
    }

    restartGame();

    function gameLoop() {
        const currentlyInCheck = isInCheck(board, 'red');
        if (currentlyInCheck !== isRedInCheck) {
            isRedInCheck = currentlyInCheck;
        }
        
        if (isRedInCheck && currentPlayer === 'red') {
            drawBoard();
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
    
    window.startGame = startGame;
    window.showMainMenu = showMainMenu;
    window.showSettings = showSettings;
    window.showGameRecords = showGameRecords;
    window.loadGame = loadGame;
    window.showModal = showModal;
    window.closeModal = closeModal;
    window.restartGame = restartGame;
    window.applySettingsToGame = applySettingsToGame;
    window.drawGame = drawGame;
    window.showGameOverModal = showGameOverModal;
    window.closeGameOverModal = closeGameOverModal;
    window.updateAiDifficultyDisplay = updateAiDifficultyDisplay;
    window.saveSettings = saveSettings;
    window.updateSettingsUI = updateSettingsUI;
    window.showDifficultyModal = showDifficultyModal;
    window.selectDifficulty = selectDifficulty;
    window.detectCheckmateType = detectCheckmateType;
    window.updateRegretButtonText = updateRegretButtonText;
    window.playOpeningAnimation = playOpeningAnimation;
})();
</script>
</body>
</html>
